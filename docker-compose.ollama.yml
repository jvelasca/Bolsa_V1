# Opcional — no forma parte del stack core (postgres).
# Uso:
#   docker compose -f docker-compose.ollama.yml up -d
#   docker exec -it bolsa-ollama ollama pull qwen2.5-coder:14b
# Env API:
#   BOLSA_LLM_PROVIDER=ollama
#   OLLAMA_BASE_URL=http://127.0.0.1:11434

services:
  ollama:
    image: ollama/ollama:latest
    container_name: bolsa-ollama
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - bolsa_ollama_data:/root/.ollama
    healthcheck:
      test: ['CMD-SHELL', 'ollama list >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  bolsa_ollama_data:
