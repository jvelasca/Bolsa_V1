[project]
name = "bolsa-api"
version = "0.1.0"
description = "Bolsa V1 — API FastAPI (capa HTTP fina)"
requires-python = ">=3.12"
dependencies = [
  "bolsa-domain",
  "bolsa-application",
  "bolsa-market",
  "bolsa-infrastructure",
  "bolsa-analytics",
  "bolsa-ai",
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.7",
]

[tool.uv.sources]
bolsa-domain = { workspace = true }
bolsa-application = { workspace = true }
bolsa-market = { workspace = true }
bolsa-infrastructure = { workspace = true }
bolsa-analytics = { workspace = true }
bolsa-ai = { workspace = true }

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "mypy>=1.14",
  "ruff>=0.9",
  "types-redis",
]

[project.scripts]
bolsa-api = "bolsa_api.main:run"
bolsa-arq-worker = "bolsa_api.workers.arq_worker:run"
bolsa-scheduler-worker = "bolsa_api.workers.scheduler_worker:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bolsa_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests that require external services (legacy API, DB)",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
