[project]
name = "bolsa-application"
version = "0.1.0"
description = "Bolsa V1 — casos de uso (application layer)"
requires-python = ">=3.12"
dependencies = [
  "bolsa-domain",
  "bolsa-analytics",
  "bolsa-market",
]

[tool.uv.sources]
bolsa-domain = { workspace = true }
bolsa-analytics = { workspace = true }
bolsa-market = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bolsa_application"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
