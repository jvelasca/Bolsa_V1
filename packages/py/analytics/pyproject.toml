[project]
name = "bolsa-analytics"
version = "0.1.0"
description = "Bolsa V1 — análisis determinista (indicadores, patrones)"
requires-python = ">=3.12"
dependencies = [
  "bolsa-domain",
  "bolsa-ai",
  "numpy>=2.0",
  "pandas>=2.2",
  "vectorbt>=0.26",
  "optuna>=4.0",
]

[project.optional-dependencies]
minimal = [
  "bolsa-domain",
]
ml = [
  "lightgbm>=4.0",
]

[tool.uv.sources]
bolsa-domain = { workspace = true }
bolsa-ai = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bolsa_analytics"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
