[project]
name = "bolsa-market"
version = "0.1.0"
description = "Bolsa V1 — ingesta y validación de datos de mercado"
requires-python = ">=3.12"
dependencies = [
  "bolsa-domain",
  "pydantic>=2.10",
  "httpx>=0.28",
]

[tool.uv.sources]
bolsa-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bolsa_market"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"
