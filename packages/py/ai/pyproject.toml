[project]
name = "bolsa-ai"
version = "0.1.0"
description = "Bolsa V1 — AI Governance (RFC-007): Proxy, Prompt Registry, adapters LLM"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bolsa_ai"]

[tool.hatch.build.targets.wheel.force-include]
"src/bolsa_ai/prompts" = "bolsa_ai/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "ollama: tests that require a running Ollama service",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
