[project]
name = "bolsa-infrastructure"
version = "0.1.0"
description = "Bolsa V1 — adaptadores DB, caché, proveedores externos"
requires-python = ">=3.12"
dependencies = [
  "bolsa-domain",
  "bolsa-market",
  "pydantic-settings>=2.7",
  # El extra `[asyncio]` es OBLIGATORIO y no cosmético: SQLAlchemy 2.1 movió `greenlet` (el shim
  # que necesita `sqlalchemy.ext.asyncio`) al extra, así que sin él un `pip install` limpio (sin
  # lock) rompe el import con `ModuleNotFoundError: No module named 'greenlet'` — exactamente lo
  # que tumbó `Optimize lab` el 2026-09-25. El techo `<2.1` mantiene la resolución de pip alineada
  # con la versión que el lock valida (2.0.x): 2.1 no está evaluada en este repositorio.
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "httpx>=0.28",
  "arq>=0.26",
  "alembic>=1.14",
  "bcrypt>=4.2",
]

[tool.uv.sources]
bolsa-domain = { workspace = true }
bolsa-market = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bolsa_infrastructure"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
