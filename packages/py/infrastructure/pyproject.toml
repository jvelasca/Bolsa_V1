[project]
name = "bolsa-infrastructure"
version = "0.1.0"
description = "Bolsa V1 — adaptadores DB, caché, proveedores externos"
requires-python = ">=3.12"
dependencies = [
  "bolsa-domain",
  "bolsa-market",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "httpx>=0.28",
  "arq>=0.26",
  "alembic>=1.14",
  "bcrypt>=4.2",
]

[tool.uv.sources]
bolsa-domain = { workspace = true }
bolsa-market = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bolsa_infrastructure"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
