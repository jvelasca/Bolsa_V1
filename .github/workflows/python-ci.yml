name: Python CI

on:
  push:
    paths:
      - 'apps/api-python/**'
      - 'packages/py/**'
      - 'pyproject.toml'
      - 'Makefile'
  pull_request:
    paths:
      - 'apps/api-python/**'
      - 'packages/py/**'
      - 'pyproject.toml'
      - 'Makefile'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check packages/py apps/api-python

      - name: Mypy
        run: uv run mypy packages/py/domain/src packages/py/market/src packages/py/infrastructure/src apps/api-python/src

      - name: Pytest
        run: uv run pytest packages/py/market/tests packages/py/analytics/tests apps/api-python/tests -q
