name: Python CI

on:
  push:
    paths:
      - 'apps/api-python/**'
      - 'packages/py/**'
      - 'pyproject.toml'
      - 'Makefile'
  pull_request:
    paths:
      - 'apps/api-python/**'
      - 'packages/py/**'
      - 'pyproject.toml'
      - 'Makefile'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        # Root pyproject select (E/F/I/UP/B); package pyprojects lack lint.select.
        run: uv run ruff check packages/py apps/api-python --config pyproject.toml

      - name: Mypy
        # Deuda tipado preexistente en main (~500 errores). No bloquea merge;
        # gate duro = Ruff + pytest. Reabrir mypy-strict en PR dedicado.
        continue-on-error: true
        run: >
          uv run mypy
          packages/py/domain/src
          packages/py/market/src
          packages/py/infrastructure/src
          apps/api-python/src
          --follow-imports=silent

      - name: Pytest
        run: uv run pytest packages/py/market/tests packages/py/analytics/tests apps/api-python/tests -q
