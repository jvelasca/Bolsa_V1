  grammar-discovery-pg:
    # V2.34 (A14): certificación PostgreSQL OBLIGATORIA por commit de la gramática
    # controlada de Discovery. Valida que una candidata gramatical recorre el lifecycle
    # con evidencia real (CPCV/PBO/WFE declarativos), que los gates robustness/
    # walk_forward dejan de quedar NOT_EVALUATED, el fail-closed sin shadow y la
    # invariante LIVE=0, con gates fail-if-skipped: un skip silencioso es un fallo duro.
    name: grammar-discovery-pg (Alembic + A14 E2E, per-commit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bolsa
          POSTGRES_PASSWORD: bolsa_dev
          POSTGRES_DB: bolsa_v1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bolsa -d bolsa_v1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bolsa:bolsa_dev@localhost:5432/bolsa_v1
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: bolsa
      DB_PASSWORD: bolsa_dev
      DB_NAME: bolsa_v1
      A14_GRAMMAR_PG_REQUIRED: '1'
      AUTO_ORCHESTRATOR_PG_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Alembic upgrade head
        run: cd packages/py/infrastructure && uv run alembic upgrade head

      # V2.39.2: el job declara A14_GRAMMAR_PG_REQUIRED=1 para exigir PG real, pero el
      # test no lo leía y podía quedar skipped sin que el job se pusiera rojo (skip
      # silencioso = certificación fantasma). ``-rs`` imprime el motivo y el paso
      # siguiente convierte cualquier skip del job en un fallo duro.
      # V2.40.2: los comentarios van FUERA del ``run`` (dentro de un bloque plegado ``>``
      # son texto del comando, no comentarios YAML: cortaban la línea y se perdían el
      # ``-rs`` y el ``tee``) y el pipe declara ``pipefail``: sin él un pytest rojo devolvía
      # el exit code de ``tee`` (0) y el job quedaba en falso verde (run 35009780076).
      - name: Pytest A14 PG (fail if skipped)
        run: |
          set -o pipefail
          uv run pytest \
            apps/api-python/tests/test_a14_grammar_discovery_pg.py \
            apps/api-python/tests/test_discovery_evidence_snapshot_pg.py \
            -q --tb=short -rs | tee /tmp/a14-pg.log

      - name: Fail on skipped A14 PG (no skip silencioso)
        # Un skip invalida la certificación: si algún test quedó fuera del veredicto, el
        # job falla con el motivo a la vista aunque el paso anterior saliera en verde.
        run: |
          if [ ! -s /tmp/a14-pg.log ]; then
            echo "::error::A14 PG no dejó log de la corrida; la certificación no es válida."
            exit 1
          fi
          if grep -qE '(^|[0-9]+ )skipped|SKIPPED' /tmp/a14-pg.log; then
            echo "::error::A14 PG dejó tests SKIPPED; la certificación no es válida."
            grep -E 'SKIPPED|skipped' /tmp/a14-pg.log || true
            exit 1
          fi
        if: always()

  auto-v2-durable-pg:
    # V2.40 (AUTO 2.0 · P4): certificación PostgreSQL OBLIGATORIA por commit de la
    # durabilidad del estado V2 (migración 040): el plan operativo de la posición
    # (``sim_auto_positions.position_state``) y las señales consumidas por barra
    # (``sim_consumed_signals``) deben SOBREVIVIR a un reinicio real de proceso —
    # el worker nuevo rehidrata el mismo PositionState (no lo reconstruye por ATR) y
    # sigue vetando el re-emitir la misma señal. Gate fail-if-skipped: sin PG real un
    # skip silencioso sería una certificación fantasma.
    name: auto-v2-durable-pg (Alembic 040-045 + reinicio real, per-commit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bolsa
          POSTGRES_PASSWORD: bolsa_dev
          POSTGRES_DB: bolsa_v1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bolsa -d bolsa_v1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bolsa:bolsa_dev@localhost:5432/bolsa_v1
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: bolsa
      DB_PASSWORD: bolsa_dev
      DB_NAME: bolsa_v1
      AUTO_V2_DURABLE_PG_REQUIRED: '1'
      # V2.40.1/AUTO 2.0: contexto de cartera del catálogo (sector + ADV + frescura) —
      # la fuente REAL que alimenta los gates fail-closed del tick. Un skip silencioso
      # invalidaría la certificación del cableado de producción.
      INSTRUMENT_TRADE_CONTEXT_PG_REQUIRED: '1'
      # V2.40.2: claves naturales únicas (reconciliación Prisma→Alembic, migración 041).
      # El dedupe con duplicados preexistentes y la atomicidad de los upsert solo se
      # certifican contra PostgreSQL real (job auto-v2-durable-pg).
      UNIQUE_NATURAL_KEYS_PG_REQUIRED: '1'
      # AUTO-1b (V2.41): libro de reservas durable (migración 042). La reserva tiene que
      # SOBREVIVIR a un reinicio de proceso y liberarse cuando el fill se materializa;
      # sin PG real el test skipearía en mudo e invalidaría la certificación.
      # V2.43.3/AUTO-3: el mismo gate cubre la identidad de salida (``exit_order_id``) y el
      # HALT durable (``auto_kill_state``) de la 043: un reinicio real no puede olvidar la
      # parada ni reutilizar una identidad histórica, y eso solo se mide contra PG real.
      AUTO_RESERVATION_PG_REQUIRED: '1'
      # V2.56/AUTO-15 (racha durable del Data Gate): la racha de fallos consecutivos del
      # sink se persiste en ``adaptive_gate_state`` (migración 045) para que un reinicio
      # NO devuelva el gate a "sano" ni pierda una racha a punto de ser ``STALE``. Solo se
      # certifica contra PG real (roundtrip de la 045 + otra sesión leyendo la racha); sin
      # PG el test skipearía en mudo e invalidaría la certificación.
      ADAPTIVE_GATE_PG_REQUIRED: '1'
      # V2.57/AUTO-16 (referencia del fill): la fricción que el SIMULADOR aplicó se mide con
      # el ``reference_mid`` que el settlement persiste (migración 046). Solo se certifica
      # contra PG real (roundtrip de la 046 + otra sesión recomponiendo la fricción de las
      # dos patas del ciclo); sin PG el test skipearía en mudo e invalidaría la medición.
      APPLIED_COST_PG_REQUIRED: '1'
      # V2.42/AUTO-2 (slice 2a): el ciclo de vida de la posición (FSM) vive en el JSONB
      # ``position_state`` (sin migración). Su rehidratación por estado intermedio, la
      # continuación del ratchet desde el ``highWatermark`` persistido y la degradación
      # de un estado no verificable solo se certifican contra PostgreSQL real.
      AUTO_V2_LIFECYCLE_PG_REQUIRED: '1'
      # El reinicio real usa el mismo camino durable del scheduler AUTO.
      AUTO_SCHEDULER_PG_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Alembic upgrade head (hasta 046 incluida)
        run: cd packages/py/infrastructure && uv run alembic upgrade head

      # V2.40.2: ``pipefail`` es obligatorio. Con ``... | tee log`` el step devuelve el
      # exit code de ``tee`` (0), así que la certificación PG quedó en falso verde con
      # ``6 failed, 22 passed`` en el run 35009780076. Y el guard de skips exige el log:
      # sin fichero, ``grep`` falla en mudo y el guard no guardaba nada.
      # AUTO-1b (V2.41): el libro de reservas durable (migración 042) se certifica aquí —
      # roundtrip de la migración, supervivencia al reinicio, liberación por fill
      # (parcial incluida) y capital reservado de una orden en vuelo (``RETRY``).
      # V2.43.3/AUTO-3: la 043 añade ``auto_kill_state`` (HALT durable) y ``auto_exit_orders``
      # (identidad de salida) más la columna ``exit_order_id`` de la reserva: se certifica el
      # roundtrip, que el INTENT y el HALT SOBREVIVEN al reinicio real (otra sesión) y que un
      # fill parcial actualiza el INTENT sin mintear una segunda identidad.
      # V2.56/AUTO-15: la racha durable del Data Gate (migración 045) — roundtrip, la racha
      # que SOBREVIVE al reinicio (otra sesión) y el gate que sigue en ``STALE``, el
      # incremento atómico por clave y el reset que no amplifica.
      # Gate fail-if-skipped: ADAPTIVE_GATE_PG_REQUIRED=1.
      # V2.57/AUTO-16: la referencia del fill (migración 046) — roundtrip, la referencia que
      # SOBREVIVE al reinicio (otra sesión) y la fricción aplicada recompuesta de las DOS
      # patas del ciclo, más la lectura por ciclo que no cruza cuentas.
      # Gate fail-if-skipped: APPLIED_COST_PG_REQUIRED=1.
      - name: Pytest AUTO 2.0 durable PG (fail if skipped)
        run: |
          set -o pipefail
          uv run pytest \
            apps/api-python/tests/test_auto_v2_durable_pg.py \
            apps/api-python/tests/test_auto_v2_lifecycle_pg.py \
            apps/api-python/tests/test_instrument_trade_context_pg.py \
            apps/api-python/tests/test_unique_natural_keys_pg.py \
            apps/api-python/tests/test_portfolio_reservation_pg.py \
            apps/api-python/tests/test_auto_v44_exit_identity_pg.py \
            apps/api-python/tests/test_auto_v56_auto15_data_gate_pg.py \
            apps/api-python/tests/test_auto_v57_auto16_applied_cost_pg.py \
            apps/api-python/tests/test_discovery_evidence_snapshot_pg.py \
            -q --tb=short -rs | tee /tmp/auto-v2-durable-pg.log

      - name: Fail on skipped AUTO 2.0 durable PG (no skip silencioso)
        # Un skip invalida la certificación: el reinicio real exige PG.
        run: |
          if [ ! -s /tmp/auto-v2-durable-pg.log ]; then
            echo "::error::AUTO 2.0 durable PG no dejó log de la corrida; la certificación no es válida."
            exit 1
          fi
          if grep -qE '(^|[0-9]+ )skipped|SKIPPED' /tmp/auto-v2-durable-pg.log; then
            echo "::error::AUTO 2.0 durable PG dejó tests SKIPPED; la certificación no es válida."
            grep -E 'SKIPPED|skipped' /tmp/auto-v2-durable-pg.log || true
            exit 1
          fi
        if: always()
