name: Python CI

on:
  push:
    paths:
      - 'apps/api-python/**'
      - 'packages/py/**'
      - 'scripts/verify/**'
      - 'pyproject.toml'
      - 'Makefile'
      - '.github/workflows/python-ci.yml'
  pull_request:
    paths:
      - 'apps/api-python/**'
      - 'packages/py/**'
      - 'scripts/verify/**'
      - 'pyproject.toml'
      - 'Makefile'
      - '.github/workflows/python-ci.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        # Root pyproject select (E/F/I/UP/B); package pyprojects lack lint.select.
        run: uv run ruff check packages/py apps/api-python --config pyproject.toml

      - name: Import-linter
        # F9-A3: 4 contracts in packages/py/.importlinter (domain purity,
        # no-ai-sdk, no-ai-in-domain, analytics-market-independence).
        run: uv run lint-imports --config packages/py/.importlinter

      - name: Mypy
        # P1.6 por fases COMPLETADO (2026-08-12): deuda preexistente (~448)
        # limpiada en domain/market/infrastructure/apps-api-python. Gate
        # BLOQUEANTE full-tree (0 errores); cualquier nuevo error rompe CI.
        run: >
          uv run mypy
          packages/py/domain/src
          packages/py/market/src
          packages/py/infrastructure/src
          packages/py/application/src
          apps/api-python/src
          --follow-imports=silent

      - name: Pytest
        # Sin servicio Postgres en este workflow: unitarios + API tests offline.
        # Integración ASGI/DB → pnpm test:coach:api / jobs con DB.
        # test_lists/test_workspaces/test_health/test_auth/test_account_isolation/test_ai_authoring
        # y R12 isolation (platform_events/trackers_policies/workspaces) + F7b backfill
        # entran al lifespan→ensure_migrated→DB: se excluyen aquí (no hay Postgres en CI),
        # mismo criterio que las DB-gated existentes (P2.5/CI).
        # R-12 A3: invariantes C/D/E son unitarios in-memory (sin PG).
        #
        # V2.40.2: los comentarios de esta lista van FUERA del bloque plegado (aquí dentro
        # sí valen, porque YAML los mira como comentarios; el problema es meterlos en el
        # ``run: >``). En un ``run: >`` cada línea es texto del comando, así que un ``#``
        # intercalado convertía el resto de la lista en comentario de shell y el step solo
        # ejecutaba hasta ahí; ``quality`` corría 936 tests y **nunca** llegaba a
        # ``apps/api-python/tests``, con los ficheros nuevos de
        # ``packages/py/application/tests`` listados pero sin ejecutar. Mismo hazard que
        # tumbó el job A14 (ver más abajo).
        #
        # V2.25/A10: fases del Strategy Lifecycle + orquestador V2.26 (herméticos).
        # V2.31/A11: Discovery Engine (catálogo + motor + dispatch declarativo del LAB).
        # V2.34/A14: gramática controlada de Discovery (composición + presupuesto).
        # V2.36/V2.37: evidencia adaptativa (prior determinista) + search policy.
        # V2.38: granularidad por región de parámetros (bucket determinista puro).
        # V2.39: régimen de mercado por trial (clasificador determinista puro, as-of).
        # V2.40/AUTO 2.0: Investment Operating System — pipeline de decisión
        # (snapshot/ranker/decider/allocator/position manager) + identidad de señal.
        # Herméticos: sin PG, sin red, sin LIVE. La durabilidad V2 con PG real va en
        # el job auto-v2-durable-pg (gate fail-if-skipped).
        # V2.32/A12: evidencia shadow ejecutada (replay determinista, sin DB).
        # V2.33/A13: forward paper determinista (sin DB, sin red).
        # V2.32/A12: el E2E A11 necesita PG real (lo corre el job lifecycle-pg abajo).
        # V2.33/A13: el E2E del Paper Forward necesita PG real (job paper-forward-pg).
        # V2.34/A14: el E2E de la gramática de Discovery necesita PG real
        # (job grammar-discovery-pg).
        # V2.40/AUTO 2.0: la durabilidad real del estado V2 (plan de posición +
        # señales consumidas, migración 040) necesita PG real (job auto-v2-durable-pg).
        # V2.40.1/AUTO 2.0: el contexto de cartera del catálogo (sector + ADV +
        # frescura) se certifica con PG real en el mismo job auto-v2-durable-pg.
        # V2.40.2: las claves naturales únicas (índices + upsert atómico) exigen PG.
        # V2.40.3: la clave de idempotencia financiera del fill (recorte sin pérdida) es
        # hermética: sin PG, sin broker. Regresión del colapso de los N fills de una
        # misma orden en una sola clave (bug de dinero que destapó el día AUTO en PG).
        # V2.40.4/AUTO 2.0 Safety & Accounting: la semántica de TOP_N (tope de
        # evaluación), el measurement status de riesgo/exposición, el libro de órdenes
        # pendientes (capital/riesgo reservados) y la validación de TradePlan son
        # herméticos (stores in-memory): entran aquí con nombre propio. El caso
        # crash-left-CAPTURED con PG real va en el job auto-v2-durable-pg.
        # V2.40.5/AUTO-1A: el ledger de posición y la lectura de fills APPLIED son
        # puros/herméticos y entran con nombre propio (un fichero nuevo NO entra solo en
        # la red de CI: la lista es explícita). El reinicio con PG real y el bucle de la
        # jornada completa del scheduler se certifican en lifecycle-pg / auto-v2-durable-pg.
        # AUTO-1: el libro de reservas (hermético) entra igual de explícito; su persistencia
        # durable y la reconciliación se certifican en el job auto-v2-durable-pg.
        # AUTO-1b: ese fichero PG queda en ``--ignore`` de este job (no hay PG aquí: sin
        # ignore se recolectaría y skipearía en mudo) y corre con gate propio allí.
        # V2.42 slice 2b (E1/E2/E3): el camino de la MESA (golden path de entrada →
        # protección → T1 → salida → reconciliación, y sus gemelos fail) entra aquí con
        # nombre propio. Es el A/B que certifica que la invalidación confirmada VENDE
        # (D2) y que el techo de mantenimiento no se re-deriva: sin registro, un cambio de
        # la decisión de posición sólo se vería en el `position_decision` hermético, no en
        # el camino completo que la mesa ejecuta.
        # El fichero nuevo del worker (reloj de mantenimiento, invalidación de tesis y ATR
        # real) vive en ``apps/api-python/tests``, que ESTE job ya recolecta entero: no se
        # lista aquí para no duplicarlo (y por el mismo motivo NO debe añadirse una ruta
        # inexistente bajo ``packages/py/application/tests``: pytest aborta con exit 4).
        # V2.42 slice 2c (cierre de AUTO-2): el día golden (``time_exit``/``thesis_exit`` en
        # el journal de un día + cero lecturas de la política legacy con V2 ON) vive también
        # en ``apps/api-python/tests`` (pase de directorio). La agregación PURA del día
        # (``packages/py/application/tests/test_auto_daily_journal.py``) SÍ se añade aquí:
        # existe desde v2.24 pero no estaba en la lista offline, así que sus gates nuevos
        # no corrían en CI.
        # V2.43/AUTO-3: la tabla pura del gobernador vive en ``packages/py/analytics/tests``
        # (pase de directorio) y la evidencia integrada en ``apps/api-python/tests``; el GATE
        # (flag OFF byte-idéntico, vetos ``governor_*``, escalado y las tres dimensiones en
        # el journal) va explícito: es aplicación, y sin registro no correría aquí.
        # V2.43.3/AUTO-3: la matriz de crash C1-C4 y el caso de reinicio con el HALT durable
        # viven en ``apps/api-python/tests`` (pase de directorio). Su gemelo PG
        # (``test_auto_v44_exit_identity_pg.py``) se ignora aquí y se certifica en
        # auto-v2-durable-pg: sin ``--ignore`` skipearía en mudo en este job.
        # V2.44/AUTO-4: el valor esperado y el optimizador puros viven en
        # ``packages/py/analytics/tests`` (pase de directorio). El GATE del cableado
        # (flag OFF byte-idéntico, el TOP que la combinación no elige con su motivo REAL)
        # va explícito porque es aplicación y sin registro no correría aquí.
        # V2.45/AUTO-5 (Golden Day 2.0): el embudo hermético (``seen == traded + rejected +
        # expired + missed`` con motivo y coste declarado) y la identidad de estrategia en
        # el payload del journal viven en ``test_auto_daily_journal.py`` (ya registrado
        # arriba) y en ``apps/api-python/tests`` (pase de directorio). El fichero PG nuevo
        # (``test_golden_day_v2_process_pg.py``) se ignora aquí y se certifica en
        # ``lifecycle-pg`` del tag con su gate propio.
        # V2.46/AUTO-6 (Crash/Recovery + Concurrent AUTO): las dos capas HERMÉTICAS
        # (``test_auto_v46_crash_recovery.py`` y ``test_auto_v46_concurrent.py``) viven en
        # ``apps/api-python/tests`` (pase de directorio). Sus gemelos PG
        # (``test_crash_recovery_day_process_pg.py`` y ``test_concurrent_auto_pg.py``) se
        # ignoran aquí —no hay PG en este job: sin ``--ignore`` skipearían en mudo— y se
        # certifican en pasos DEDICADOS de ``lifecycle-pg`` del tag con gate propio.
        # V2.46.x/AUTO-6 HARDENING: la recuperación de la parada dura, la inyección de
        # crash por transición y la concurrencia MULTI-PROCESO son capas PG (sus gemelos
        # herméticos —``test_auto_v46_hardkill_recovery.py`` y
        # ``test_auto_v46_crash_injection_matrix.py``— entran por el pase de directorio).
        # Sus ficheros PG se ignoran aquí y corren en pasos DEDICADOS del tag.
        # V2.47 (trazabilidad de ciclo, identidad de señales, valor esperado en el journal
        # y AUTO-7) + AUTO-6.1: sus gates de APLICACIÓN NO entran por el pase de directorio
        # de ``packages/py/analytics/tests`` (a diferencia del informe PURO de
        # auto-evaluación, que sí entra por analytics), así que van REGISTRADOS a mano o no
        # correrían nunca en este job: ``test_auto_v47_cycle_trace.py``,
        # ``test_auto_v47_expected_value_journal.py``, ``test_auto_v47_signal_identity.py``
        # y ``test_auto_self_evaluation_feed.py``.
        # V2.47 (hallazgo de cobertura de la PASADA, no de esta fase): esta lista es POR
        # FICHERO y ``test_decision_journal_studies.py`` (existe desde v2.44) no estaba en
        # la de NINGÚN job, así que sus 10 tests no corrían en CI en ninguna parte. Se
        # registra aquí y en el job ``python`` del tag: la misma deuda que v2.42.2 cerró
        # a mano para ``test_auto_daily_journal.py``.
        # V2.48/AUTO-8 (Adaptive AUTO): el puro ``test_auto_adaptive.py`` entra por el pase
        # de directorio de ``packages/py/analytics/tests``; el gate de APLICACIÓN
        # ``test_auto_adaptive_entry.py`` (flag OFF byte-idéntico, Adaptive no salta los
        # gates duros, rotación con régimen sintético) va EXPLÍCITO porque sin registro no
        # correría en este job.
        # V2.50/AUTO-9 (R medido por ciclo): ``test_cycle_risk.py`` prueba el productor
        # READ-ONLY de denominador de R y su costura con el informe AUTO-7. Vive en
        # ``packages/py/application/tests``, que NO tiene pase de directorio en este job:
        # sin registro explícito no correría en ninguna parte. Su costura en el worker
        # (``apps/api-python/tests/test_auto_v50_auto9_cycle_risk_seam.py``) sí entra por
        # el pase de directorio de ``apps/api-python/tests`` de abajo.
        # V2.51/AUTO-10 (journal durable por ciclo): el constructor PURO
        # ``test_auto_cycle_journal.py`` (derivación determinista de ``decision_id``,
        # hueco declarado, payload estable) va EXPLÍCITO por la misma razón: sin registro
        # no correría en ninguna parte. Su costura en el worker
        # (``apps/api-python/tests/test_auto_v51_auto10_cycle_journal_seam.py``) entra por
        # el pase de directorio de ``apps/api-python/tests``.
        # V2.51/AUTO-10 (lector del journal, paso 3): ``test_auto_cycle_regime_reader.py``
        # (derivación del ``decision_id``, confirmación por payload, los tres huecos
        # separados y tandas acotadas) va EXPLÍCITO por la misma razón. Su costura de
        # consumo en el worker (``test_auto_v51_auto10_cycle_regime_seam.py``) entra por el
        # pase de directorio, y la durabilidad real (escritor + lector desde OTRA sesión)
        # se certifica con PG en el job ``auto-v2-durable-pg``.
        # V2.52/AUTO-11 (estado Adaptive durable): los TRES módulos puros nuevos viven en
        # ``packages/py/application/tests``, que NO tiene pase de directorio aquí, así que
        # van EXPLÍCITOS o no correrían en ninguna parte:
        # ``test_auto_adaptive_journal.py`` (evento, builder y ``decision_id`` determinista
        # por turno), ``test_auto_adaptive_recovery.py`` (racha trailing por versión,
        # saturación del contador, política que cambia y huecos declarados) y
        # ``test_auto_cycle_reconciliation.py`` (ciclo con capital y sin traza, y al
        # revés). Su costura en el worker
        # (``apps/api-python/tests/test_auto_v52_auto11_adaptive_state_seam.py``) entra por
        # el pase de directorio de ``apps/api-python/tests`` de abajo.
        # V2.56/AUTO-15 (racha durable del Data Gate): la certificación contra PG REAL
        # (``test_auto_v56_auto15_data_gate_pg.py``) vive en el job ``auto-v2-durable-pg``,
        # así que aquí va en ``--ignore`` —sin PG skipearía en mudo y aparentaría cubrirla—.
        # Los puros del store (``packages/py/application/tests/test_adaptive_gate_store.py``,
        # entrada explícita más arriba) y la declaración del gate (``test_auto_adaptive_data_gate.py``,
        # pase de directorio de analytics) corren aquí; la costura del reinicio
        # (``apps/api-python/tests/test_auto_v56_auto15_data_gate_durable_seam.py``) entra por
        # el pase de directorio de ``apps/api-python/tests``.
        # V2.57/AUTO-16 (referencia del fill): los puros del espejo durable y del coste
        # aplicado (``packages/py/application/tests/test_sim_fill_reference.py`` y
        # ``.../test_applied_cost.py``) van EXPLÍCITOS por el mismo motivo (ese directorio no
        # tiene pase aquí). La certificación PG (migración 046 + la referencia sobresaliendo a
        # una sesión nueva) vive en el job ``auto-v2-durable-pg`` con gate fail-if-skipped.
        # V2.60/AUTO-19A (incertidumbre del edge + replay OOS): la costura del worker
        # (``apps/api-python/tests/test_auto_v60_auto19_uncertainty_seam.py``) se lista
        # EXPLÍCITA —como pide el plan de la fase— para que el frame ``uncertainty`` y las dos
        # claves nuevas de la evidencia queden certificados con nombre propio, no solo por el
        # pase de directorio de abajo (pytest deduplica la doble mención: no corre dos veces).
        # Los puros entran por el pase de ``packages/py/analytics/tests``.
        # V2.61/AUTO-19B (calibración del intervalo + walk-forward): el puro
        # ``packages/py/analytics/tests/test_auto_adaptive_calibration.py`` entra por el pase de
        # directorio de abajo. No hay costura nueva que listar: el instrumento es PURO y read-only
        # (no se cablea al worker, ni al plan, ni al journal), así que no hay fichero de
        # ``apps/api-python/tests`` que certificar con nombre propio en esta fase.
        run: >
          uv run pytest
          packages/py/domain/tests
          packages/py/market/tests
          packages/py/analytics/tests
          packages/py/application/tests/test_lifecycle_event_store.py
          packages/py/application/tests/test_reconcile_lifecycle_integrity_v193.py
          packages/py/application/tests/test_reconcile_financial_integrity_v194.py
          packages/py/application/tests/test_reconciliation_opening_gate.py
          packages/py/application/tests/test_strategy_lab_phase.py
          packages/py/application/tests/test_strategy_top3_coach_phase.py
          packages/py/application/tests/test_strategy_promotion_phase.py
          packages/py/application/tests/test_strategy_vigilance_phase.py
          packages/py/application/tests/test_auto_orchestrator.py
          packages/py/application/tests/test_auto_daily_journal.py
          packages/py/application/tests/test_sim_durable_unit_of_work.py
          packages/py/application/tests/test_discovery_catalog.py
          packages/py/application/tests/test_strategy_discovery_engine.py
          packages/py/application/tests/test_lab_discovery_dispatch.py
          packages/py/application/tests/test_discovery_grammar.py
          packages/py/application/tests/test_discovery_evidence.py
          packages/py/application/tests/test_discovery_search_policy.py
          packages/py/application/tests/test_discovery_param_region.py
          packages/py/application/tests/test_discovery_market_regime.py
          packages/py/application/tests/test_auto_v3_governor_gate.py
          packages/py/application/tests/test_auto_v4_optimizer_wiring.py
          packages/py/application/tests/test_auto_v2_entry.py
          packages/py/application/tests/test_auto_v47_cycle_trace.py
          packages/py/application/tests/test_auto_v47_expected_value_journal.py
          packages/py/application/tests/test_auto_v47_signal_identity.py
          packages/py/application/tests/test_auto_self_evaluation_feed.py
          packages/py/application/tests/test_auto_adaptive_entry.py
          packages/py/application/tests/test_cycle_risk.py
          packages/py/application/tests/test_auto_cycle_journal.py
          packages/py/application/tests/test_auto_cycle_regime_reader.py
          packages/py/application/tests/test_auto_adaptive_journal.py
          packages/py/application/tests/test_auto_adaptive_recovery.py
          packages/py/application/tests/test_auto_cycle_reconciliation.py
          packages/py/application/tests/test_adaptive_gate_store.py
          packages/py/application/tests/test_sim_fill_reference.py
          packages/py/application/tests/test_applied_cost.py
          packages/py/application/tests/test_decision_journal_studies.py
          packages/py/application/tests/test_auto_investment_system.py
          packages/py/application/tests/test_portfolio_decision_engine.py
          packages/py/application/tests/test_trade_plan.py
          packages/py/application/tests/test_execution_event.py
          packages/py/application/tests/test_applied_fills.py
          packages/py/application/tests/test_position_manager.py
          packages/py/application/tests/test_v127_golden_path.py
          packages/py/application/tests/test_v127_golden_path_fail.py
          packages/py/application/tests/test_auto_v2_lifecycle_stop.py
          packages/py/application/tests/test_portfolio_reservation.py
          packages/py/application/tests/test_active_strategy_runtime_state.py
          packages/py/application/tests/test_sim_durable_v2_state.py
          packages/py/application/tests/test_idempotency_key_budget.py
          packages/py/analytics/tests/test_rules_engine_series_wiring.py
          packages/py/application/tests/test_strategy_shadow_phase.py
          packages/py/application/tests/test_paper_forward_phase.py
          packages/py/infrastructure/tests/test_verify_financial_invariants.py
          apps/api-python/tests/test_auto_v60_auto19_uncertainty_seam.py
          apps/api-python/tests
          --ignore=apps/api-python/tests/integration
          --ignore=apps/api-python/tests/test_lists.py
          --ignore=apps/api-python/tests/test_workspaces.py
          --ignore=apps/api-python/tests/test_health.py
          --ignore=apps/api-python/tests/test_auth.py
          --ignore=apps/api-python/tests/test_account_isolation.py
          --ignore=apps/api-python/tests/test_ai_authoring.py
          --ignore=apps/api-python/tests/test_f7b_legacy_user_id_backfill.py
          --ignore=apps/api-python/tests/test_platform_events_isolation.py
          --ignore=apps/api-python/tests/test_trackers_policies_isolation.py
          --ignore=apps/api-python/tests/test_workspaces_isolation.py
          --ignore=apps/api-python/tests/test_lifecycle_auth.py
          --ignore=apps/api-python/tests/test_lifecycle_golden_v188.py
          --ignore=apps/api-python/tests/test_lifecycle_golden_v190.py
          --ignore=apps/api-python/tests/test_lifecycle_golden_v191.py
          --ignore=apps/api-python/tests/test_lifecycle_golden_v195.py
          --ignore=apps/api-python/tests/test_lifecycle_golden_v196.py
          --ignore=apps/api-python/tests/test_lifecycle_outbox_worker_pg.py
          --ignore=apps/api-python/tests/test_financial_integrity_pg.py
          --ignore=apps/api-python/tests/test_a11_discovery_to_auto_sim_pg.py
          --ignore=apps/api-python/tests/test_a13_paper_forward_pg.py
          --ignore=apps/api-python/tests/test_a14_grammar_discovery_pg.py
          --ignore=apps/api-python/tests/test_auto_v2_durable_pg.py
          --ignore=apps/api-python/tests/test_auto_v2_lifecycle_pg.py
          --ignore=apps/api-python/tests/test_instrument_trade_context_pg.py
          --ignore=apps/api-python/tests/test_unique_natural_keys_pg.py
          --ignore=apps/api-python/tests/test_portfolio_reservation_pg.py
          --ignore=apps/api-python/tests/test_auto_v44_exit_identity_pg.py
          --ignore=apps/api-python/tests/test_auto_v56_auto15_data_gate_pg.py
          --ignore=apps/api-python/tests/test_auto_v57_auto16_applied_cost_pg.py
          --ignore=apps/api-python/tests/test_golden_day_v2_process_pg.py
          --ignore=apps/api-python/tests/test_crash_recovery_day_process_pg.py
          --ignore=apps/api-python/tests/test_concurrent_auto_pg.py
          --ignore=apps/api-python/tests/test_auto_v46_hardkill_recovery_pg.py
          --ignore=apps/api-python/tests/test_auto_v46_crash_injection_pg.py
          --ignore=apps/api-python/tests/test_auto_v46_multiprocess_pg.py
          --ignore=apps/api-python/tests/chaos/live_a7
          -q

  lifecycle-pg:
    # V2.32.1 (auditoría P1-02): certificación PostgreSQL OBLIGATORIA por commit de
    # backend, no solo en el tag. El E2E A12 (DISCOVERY → SHADOW → SIM → READOPT →
    # VIGILANCIA) y las migraciones 032/033/034 se validan en cada push/PR, con gates
    # fail-if-skipped: un skip silencioso aquí es un fallo duro.
    name: lifecycle-pg (Alembic + A12 E2E, per-commit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bolsa
          POSTGRES_PASSWORD: bolsa_dev
          POSTGRES_DB: bolsa_v1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bolsa -d bolsa_v1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bolsa:bolsa_dev@localhost:5432/bolsa_v1
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: bolsa
      DB_PASSWORD: bolsa_dev
      DB_NAME: bolsa_v1
      LIFECYCLE_PG_REQUIRED: '1'
      AUTO_ORCHESTRATOR_PG_REQUIRED: '1'
      STRATEGY_LIFECYCLE_PG_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Alembic upgrade head
        run: cd packages/py/infrastructure && uv run alembic upgrade head

      - name: Pytest A12 PG (fail if skipped)
        run: >
          uv run pytest
          apps/api-python/tests/test_a11_discovery_to_auto_sim_pg.py
