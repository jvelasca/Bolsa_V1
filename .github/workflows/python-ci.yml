name: Python CI

on:
  push:
    paths:
      - 'apps/api-python/**'
      - 'packages/py/**'
      - 'pyproject.toml'
      - 'Makefile'
  pull_request:
    paths:
      - 'apps/api-python/**'
      - 'packages/py/**'
      - 'pyproject.toml'
      - 'Makefile'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        # Root pyproject select (E/F/I/UP/B); package pyprojects lack lint.select.
        run: uv run ruff check packages/py apps/api-python --config pyproject.toml

      - name: Mypy
        # Deuda tipado preexistente en main (~450 errores). No bloquea merge;
        # gate duro = Ruff + pytest + Mypy scoped per-fase (abajo).
        continue-on-error: true
        run: >
          uv run mypy
          packages/py/domain/src
          packages/py/market/src
          packages/py/infrastructure/src
          apps/api-python/src
          --follow-imports=silent

      - name: Mypy — gate scoped F4 (bloqueante)
        # F4 (arquitectura Python): gate mypy duro SOLO sobre los ficheros nuevos/tocados
        # en la fase que quedan tipo-limpios (P0.6 + ruff gates). El resto del árbol
        # mantiene continue-on-error hasta su fase (P1.6 por fases, decisión pactada).
        run: >
          uv run mypy
          packages/py/domain/src/bolsa_domain/entities/market_event.py
          packages/py/domain/src/bolsa_domain/value_objects/excerpt.py
          packages/py/market/src/bolsa_market/news_snapshot.py
          packages/py/market/src/bolsa_market/filing_store.py
          packages/py/analytics/src/bolsa_analytics/knowledge/filing_summary.py
          packages/py/analytics/src/bolsa_analytics/knowledge/news_assessment.py
          packages/py/analytics/src/bolsa_analytics/cognitive/__init__.py
          packages/py/infrastructure/alembic/env.py
          packages/py/infrastructure/alembic/versions/001_timescaledb_extension.py
          packages/py/infrastructure/src/bolsa_infrastructure/database/account_migration.py
          packages/py/infrastructure/src/bolsa_infrastructure/database/migrations.py
          packages/py/infrastructure/src/bolsa_infrastructure/database/repositories/portfolio_repository.py
          apps/api-python/src/bolsa_api/api/v1/routes/portfolio.py
          --follow-imports=silent

      - name: Pytest
        # Sin servicio Postgres en este workflow: unitarios + API tests offline.
        # Integración ASGI/DB → pnpm test:coach:api / jobs con DB.
        run: >
          uv run pytest
          packages/py/market/tests
          packages/py/analytics/tests
          apps/api-python/tests
          --ignore=apps/api-python/tests/integration
          --ignore=apps/api-python/tests/test_lists.py
          --ignore=apps/api-python/tests/test_workspaces.py
          -q
