  lifecycle-pg:
    name: lifecycle-pg (Alembic + auth + golden restart)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bolsa
          POSTGRES_PASSWORD: bolsa_dev
          POSTGRES_DB: bolsa_v1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bolsa -d bolsa_v1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bolsa:bolsa_dev@localhost:5432/bolsa_v1
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: bolsa
      DB_PASSWORD: bolsa_dev
      DB_NAME: bolsa_v1
      LIFECYCLE_PG_REQUIRED: '1'
      # V2.23/A9: gates PG nuevos fail-if-skipped. PostgreSQL está presente en este
      # job, así que los tests PG de A9 (estado durable AUTO Engine y finance SIM
      # real) DEBEN ejecutarse: un skip silencioso aquí es un fallo duro (no-green).
      AUTO_M4_PG_REQUIRED: '1'
      AUTO_M5_FIN_PG_REQUIRED: '1'
      # V2.23/A9 (Bloque 6): certificación AUTO SIM-ONLY end-to-end por el camino real
      # del scheduler. Un skip aquí (sin PG/credenciales) es un fallo duro.
      AUTO_SCHEDULER_PG_REQUIRED: '1'
      # V2.24/A9.1 (P2-04/P2-05): el proceso REAL del scheduler debe arrancar sobre
      # PG y el día AUTO certificarse con el invariante de equity sobre el ledger
      # real. Cualquier skip silencioso aquí es un fallo duro.
      AUTO_SCHEDULER_PROCESS_PG_REQUIRED: '1'
      AUTO_EQUITY_INVARIANT_PG_REQUIRED: '1'
      # V2.24.2 (P2-D): restart REAL del proceso con posición/protección abierta
      # (readopción durable sin doble BUY). Reusa el mismo gate de proceso.
      AUTO_SCHEDULER_RESTART_PG_REQUIRED: '1'
      # V2.40/AUTO 2.0 (P4): durabilidad REAL del estado V2 (plan operativo de la
      # posición + señales consumidas por barra, migración 040). Sin PG este test
      # skipearía en mudo, así que un skip aquí es un fallo duro.
      AUTO_V2_DURABLE_PG_REQUIRED: '1'
      # V2.40.1/AUTO 2.0: contexto de cartera del catálogo (sector + ADV + frescura)
      # que alimenta los gates fail-closed del tick. Mismo gobierno: sin PG el test
      # skipearía en mudo, así que un skip aquí es un fallo duro.
      INSTRUMENT_TRADE_CONTEXT_PG_REQUIRED: '1'
      # V2.40.2: claves naturales únicas (reconciliación Prisma→Alembic, migración 041).
      # El dedupe con duplicados preexistentes y la atomicidad de los upsert de tops/
      # narrativas/opiniones solo se certifican contra PostgreSQL real.
      UNIQUE_NATURAL_KEYS_PG_REQUIRED: '1'
      # AUTO-1b (V2.41): libro de reservas durable (migración 042). La reserva tiene que
      # SOBREVIVIR a un reinicio de proceso y liberarse cuando el fill se materializa;
      # sin PG real el test skipearía en mudo e invalidaría la certificación del tag.
      AUTO_RESERVATION_PG_REQUIRED: '1'
      # V2.56/AUTO-15 (racha durable del Data Gate): la racha de fallos consecutivos del
      # sink se persiste en ``adaptive_gate_state`` (migración 045). Un reinicio del proceso
      # no puede olvidarla (ni devolver el gate a "sano" ni perder una racha a punto de ser
      # ``STALE``), y eso solo se mide contra PG real: un skip mudo invalidaría la
      # certificación del tag.
      ADAPTIVE_GATE_PG_REQUIRED: '1'
      # V2.57/AUTO-16 (referencia del fill): la fricción que el SIMULADOR aplicó se mide con
      # el ``reference_mid`` que el settlement persiste (migración 046). Solo se certifica
      # contra PG real (roundtrip de la 046 + otra sesión recomponiendo la fricción de las
      # dos patas del ciclo): un skip mudo invalidaría la medición del tag.
      APPLIED_COST_PG_REQUIRED: '1'
      # V2.63/AUTO-20B (completitud del volcado de material): el E2E del exportador recorre la
      # cadena entera (fills + reservas + régimen → JSON → calibración walk-forward) contra PG
      # real, con oráculo independiente y test same-material AUTO-7 vs AUTO-20. Un skip mudo
      # dejaría la deuda nº 1 de ``v2.62`` sin certificar en el tag.
      AUTO20B_EXPORT_PG_REQUIRED: '1'
      # V2.74/AUTO-MATERIAL-2 (productor V2 sobre PG real): que la estructura que el worker
      # AUTO 2.0 acuña —``cycle_id`` en los fills, reserva de entrada con denominador,
      # salida con ``cycle_id``, ciclo cerrado y R medible— SOBREVIVA al commit y sea
      # reconstruida por ``paper_material_readiness_v2`` desde una conexión NUEVA (leída por
      # el lector REAL del CLI). Un skip mudo dejaría el bloqueo del productor sin certificar
      # sobre PG en el tag.
      AUTO_V74_PRODUCER_PG_REQUIRED: '1'
      # V2.42/AUTO-2 (slice 2a): el ciclo de vida de la posición (FSM) vive en el JSONB
      # ``position_state`` (sin migración). Su rehidratación por estado intermedio, la
      # continuación del ratchet desde el ``highWatermark`` persistido y la degradación
      # de un estado no verificable solo se certifican contra PostgreSQL real.
      AUTO_V2_LIFECYCLE_PG_REQUIRED: '1'
      # V2.25/A10: persistencia del Strategy Lifecycle (migración 030) en PG real.
      STRATEGY_LIFECYCLE_PG_REQUIRED: '1'
      # V2.26/A10: ciclo completo del Auto Orchestrator sobre PG real (promoción solo
      # con shadow; degradación → re-LAB sin swap). Skip silencioso = fallo duro.
      AUTO_ORCHESTRATOR_PG_REQUIRED: '1'
      JWT_SIGNING_KEY: ci-lifecycle-pg-secret-key
      APP_AUTH_SECRET: ci-lifecycle-pg-secret-key
      # V2.30 (higiene auditable): gates de los tests PG recién incorporados al job.
      # Un skip silencioso aquí enmascararía de nuevo el drift (era el fallo real:
      # test_f3b/test_ledger esperaban la head 004 sin que nadie lo notara).
      LIVE_PG_REQUIRED: '1'
      E2_PG_REQUIRED: '1'
      EXECUTION_FENCE_PG_REQUIRED: '1'
      # V2.45/AUTO-5 (Golden Day 2.0): el día REAL con proceso de scheduler + PG debe
      # ejecutarse; sin PG real el test skipearía en mudo e invalidaría la certificación
      # del tag. Guard anti-skip dedicado más abajo (log + grep de ``skipped``).
      AUTO_GOLDEN_DAY_V2_PG_REQUIRED: '1'
      # V2.46/AUTO-6 (Crash/Recovery + Concurrent AUTO): los dos escenarios reales sobre
      # PG (proceso scheduler matado en sucio + tres sesiones concurrentes sobre la misma
      # cuenta) deben ejecutarse; un skip mudo invalidaría la certificación del tag. Cada
      # escenario tiene su paso DEDICADO y su guard anti-skip (log + grep de ``skipped``).
      AUTO_CRASH_RECOVERY_PG_REQUIRED: '1'
      AUTO_CONCURRENT_PG_REQUIRED: '1'
      # V2.46.x/AUTO-6 HARDENING: la recuperación de la parada dura (engage → crash →
      # restart HALTED → release con reconciliación → RUNNING), la inyección de crash por
      # transición (exactly-once del efecto financiero) y la concurrencia MULTI-PROCESO
      # real (N ``scheduler_worker`` sobre la misma señal) son capas PG. Un skip mudo
      # invalidaría la certificación del tag; cada una tiene su paso DEDICADO con guard
      # anti-skip (log + grep de ``skipped``).
      AUTO_HARDKILL_PG_REQUIRED: '1'
      AUTO_CRASH_INJECT_PG_REQUIRED: '1'
      AUTO_MULTIPROCESS_PG_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Alembic upgrade head
        run: cd packages/py/infrastructure && uv run alembic upgrade head

      - name: Pytest lifecycle PG + auth + golden V1.88–V1.91/V1.95/V1.96 + worker V1.92/V1.93/V1.97 + integrity V1.94 + health schema-aware V2.15 (fail if skipped)
        # V2.40.2: los comentarios de procedencia van FUERA del bloque plegado. En un
        # ``run: >`` cada línea es texto del comando, así que un ``#`` intercalado
        # convertía el resto de la lista en comentario de shell: este step ejecutaba sólo
        # los 10 primeros tests y el job quedaba verde con el resto de la certificación
        # PG sin correr (audit-pack v2.40.2; mismo hazard en python-ci.yml).
        #
        # V2.22/A9 (M4): estado durable AUTO Engine (Alembic 027) readopción crash.
        # V2.22/A9 (last gap): finance AUTO SIM-ONLY real-PG (ExecuteTrade por fill).
        # V2.23/A9 (Bloque 6): certificación AUTO SIM-ONLY end-to-end por el scheduler
        # real (ticks/events/orders/fills/positions/ledger + no-LIVE + readopción crash
        # sin doble BUY/efecto).
        # V2.24/A9.1 (P2-04/P2-05): Reina REAL por proceso scheduler (sin run_tick manual
        # ni decider scripteado) + invariante de equity sobre el ledger real.
        # V2.25/A10: persistencia del Strategy Lifecycle (migración 030) sobre PG.
        # V2.28/A10: vigilancia real (fills SIM atribuidos + migración 031).
        # V2.29/A10: campeón persistido + dictamen COACH comparativo sobre PG.
        # V2.32/A12: certificación A11 end-to-end (DISCOVERY → SHADOW → SIM →
        # VIGILANCIA) sobre PG real, con shadow ejecutado, atribución post-crash
        # (migración 033). V2.32.1: además lo corre el job lifecycle-pg de python-ci.yml
        # en cada push (certificación por commit).
        # V2.36/V2.37: snapshot de evidencia (fingerprint + migración 037).
        # V2.40/AUTO 2.0 (P4): durabilidad REAL del estado V2 — reinicio de proceso sobre
        # la misma BD con el plan operativo y las señales consumidas intactos (migración
        # 040). Gate fail-if-skipped: AUTO_V2_DURABLE_PG_REQUIRED=1.
        # V2.40.1/AUTO 2.0: contexto de cartera del catálogo (sector + ADV + frescura) —
        # la fuente REAL de los gates fail-closed del tick.
        # Gate fail-if-skipped: INSTRUMENT_TRADE_CONTEXT_PG_REQUIRED=1.
        # V2.40.2: claves naturales únicas — el "sin backstop + check-then-insert" que
        # dejó la ruta de opiniones diarias en MultipleResultsFound permanente.
        # Gate fail-if-skipped: UNIQUE_NATURAL_KEYS_PG_REQUIRED=1.
        # AUTO-1b (V2.41): libro de reservas durable (migración 042) — roundtrip de la
        # migración, supervivencia al reinicio, liberación por fill (parcial incluida) y
        # capital reservado de una orden en vuelo (``RETRY``).
        # Gate fail-if-skipped: AUTO_RESERVATION_PG_REQUIRED=1.
        # V2.56/AUTO-15: la racha durable del Data Gate (migración 045) — roundtrip, la racha
        # que SOBREVIVE al reinicio (otra sesión) con el gate todavía en ``STALE``, el
        # incremento atómico por (cuenta, motor) y el reset que no amplifica.
        # Gate fail-if-skipped: ADAPTIVE_GATE_PG_REQUIRED=1.
        # V2.57/AUTO-16: la referencia del fill (migración 046) — roundtrip, la referencia que
        # SOBREVIVE al reinicio (otra sesión) con la fricción aplicada recompuesta de las DOS
        # patas del ciclo, y la lectura por ciclo que no cruza cuentas.
        # Gate fail-if-skipped: APPLIED_COST_PG_REQUIRED=1.
        # V2.63/AUTO-20B: el E2E del exportador de material PAPER —fills + reservas + régimen
        # del journal → volcado real (``main`` sin mocks) → JSON → calibración walk-forward—
        # con cardinalidad contra un oráculo independiente, completitud de la paginación
        # (``--limit`` pequeño) y test same-material AUTO-7 vs AUTO-20.
        # V2.64/AUTO-20C: ademas, el PERIMETRO declarado —fills sin version y de otra version
        # cuantificados como excluidos, versiones observadas frente a las pedidas, y procedencia
        # PAPER virtual— con el universo medido invariante.
        # Gate fail-if-skipped: AUTO20B_EXPORT_PG_REQUIRED=1.
        # V2.74/AUTO-MATERIAL-2: E2E del PRODUCTOR V2 sobre PG real — el worker AUTO 2.0
        # acuña la estructura (``cycle_id``/reserva/exit/ciclo cerrado/R medible), se COMMITEA,
        # se cortan las conexiones y el gate (lector REAL del CLI) la reconstruye desde una
        # conexión NUEVA hasta ``PRODUCER_READY``. Gate fail-if-skipped: AUTO_V74_PRODUCER_PG_REQUIRED=1.
        # V2.30 (higiene auditable): tests PG que estaban FUERA de todos los jobs (deuda:
        # drift silencioso). Ahora se ejecutan aquí con gate fail-if-skipped.
        run: >
          uv run pytest
          packages/py/infrastructure/tests/test_lifecycle_event_store_pg.py
          apps/api-python/tests/test_lifecycle_auth.py
          apps/api-python/tests/test_lifecycle_golden_v188.py
          apps/api-python/tests/test_lifecycle_golden_v190.py
          apps/api-python/tests/test_lifecycle_golden_v191.py
          apps/api-python/tests/test_lifecycle_golden_v195.py
          apps/api-python/tests/test_lifecycle_golden_v196.py
          apps/api-python/tests/test_lifecycle_outbox_worker_pg.py
          apps/api-python/tests/test_financial_integrity_pg.py
          apps/api-python/tests/test_auto_engine_state_pg.py
          apps/api-python/tests/test_simulated_finance_pg.py
          apps/api-python/tests/test_auto_scheduler_real_pg_zero_human_intervention.py
          apps/api-python/tests/test_a9_scheduler_process_pg_zero_human.py
          apps/api-python/tests/test_strategy_lifecycle_pg.py
          packages/py/application/tests/test_sim_strategy_attribution.py
          apps/api-python/tests/test_a11_discovery_to_auto_sim_pg.py
          apps/api-python/tests/test_discovery_evidence_snapshot_pg.py
          apps/api-python/tests/test_auto_v2_durable_pg.py
          apps/api-python/tests/test_auto_v2_lifecycle_pg.py
          apps/api-python/tests/test_instrument_trade_context_pg.py
          apps/api-python/tests/test_unique_natural_keys_pg.py
          apps/api-python/tests/test_portfolio_reservation_pg.py
          apps/api-python/tests/test_auto_v44_exit_identity_pg.py
          apps/api-python/tests/test_auto_v56_auto15_data_gate_pg.py
          apps/api-python/tests/test_auto_v57_auto16_applied_cost_pg.py
          apps/api-python/tests/test_auto_v63_auto20b_export_e2e_pg.py
          apps/api-python/tests/test_auto_v74_producer_pg_e2e.py
          apps/api-python/tests/test_health.py
          packages/py/infrastructure/tests/test_f3b_alembic_data_epoch.py
          packages/py/infrastructure/tests/test_ledger_entries_reference_unique.py
          packages/py/infrastructure/tests/test_execution_event_fence_pg.py
          packages/py/application/tests/test_live_order_store_pg.py
          packages/py/application/tests/test_submit_intent_store_pg.py
          apps/api-python/tests/test_e2_v2_14_incident_dedup_pg.py
          apps/api-python/tests/test_live_order_recovery_concurrency_pg.py
          -q
          --tb=short

      # V2.16-beta fix CI (relevo iso 2026-09-09): el gate de aislamiento (Bloque C
      # V2.15.4) NO debe compartir `bolsa_v1` con el paso anterior de lifecycle/
      # golden/outbox/financial_integrity/health. Ese paso-7 deja residuo persistente
      # de otros owners/cuentas/sesiones/recuerdos en `bolsa_v1`; 3 tests de la iso
      # asumen BD sin datos ajenos → 3 failed cuando comparten BD. La iso corre ahora
      # sobre una BD dedicada propia `bolsa_v1_iso` (drop+create + migración limpia).
      # Es un cambio de estructura/higiene de estado del job; NO toca el código V2.15.4.
      - name: Install PostgreSQL client (psql/createdb) para scratch iso
        # Los runners ubuntu-latest NO traen psql/createdb (ver dr-verify). El rol
        # bolsa del container de servicio postgres:16-alpine es superuser del servidor
        # → puede DROP/CREATE una BD scratch dedicada en el mismo server.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Prepare dedicated iso scratch DB (bolsa_v1_iso) drop+create+migrate
        env:
          # Solo este step/hijo apunta a la scratch; el resto del job sigue con bolsa_v1.
          DATABASE_URL: postgresql://bolsa:bolsa_dev@localhost:5432/bolsa_v1_iso
          DB_NAME: bolsa_v1_iso
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: bolsa
          PGPASSWORD: bolsa_dev
        run: |
          psql -d bolsa_v1 -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS bolsa_v1_iso WITH (FORCE);" \
            -c "CREATE DATABASE bolsa_v1_iso OWNER bolsa;"
          cd packages/py/infrastructure && uv run alembic upgrade head

      - name: Pytest account-isolation gate V2.15.4 (dedicated real-PG, account-less + workspaces/platform/trackers)
        # V2.15.4 Bloque C: las suites de aislamiento de cuenta/workspace/plataforma/
        # tracker se ejecutan aquí frente a su BD real dedicada bolsa_v1_iso aislada
        # del residuo del paso lifecycle (relevo iso 2026-09-09 → 43 passed).
        # `certify` depende de lifecycle-pg → un fallo aquí no-GREENea el tag.
        # (las mismas quedan en --ignore del job python-offline porque requieren PG).
        env:
          DATABASE_URL: postgresql://bolsa:bolsa_dev@localhost:5432/bolsa_v1_iso
          DB_NAME: bolsa_v1_iso
        run: >
          uv run pytest
          apps/api-python/tests/test_account_isolation.py
          apps/api-python/tests/test_workspaces_isolation.py
          apps/api-python/tests/test_platform_events_isolation.py
          apps/api-python/tests/test_trackers_policies_isolation.py
          -q
          --tb=short

      # V2.45/AUTO-5 (Golden Day 2.0): el DÍA REAL con el proceso de scheduler y PG real
      # se certifica con gate propio fail-if-skipped. Va en paso DEDICADO (no se toca el
      # ``run: >`` de arriba) para poder dejar log y aplicar el guard anti-skip: un skip
      # silencioso sería una certificación fantasma del día real.
      - name: Pytest Golden Day 2.0 (proceso scheduler V2 + PG, fail if skipped)
        run: |
          set -o pipefail
          uv run pytest \
            apps/api-python/tests/test_golden_day_v2_process_pg.py \
            -q --tb=short -rs | tee /tmp/golden-day-v2-pg.log

      - name: Fail on skipped Golden Day 2.0 (no skip silencioso)
        if: always()
        run: |
          if [ ! -s /tmp/golden-day-v2-pg.log ]; then
            echo "::error::Golden Day 2.0 no dejó log de la corrida; la certificación no es válida."
            exit 1
          fi
          if grep -qE '(^|[0-9]+ )skipped|SKIPPED' /tmp/golden-day-v2-pg.log; then
            echo "::error::Golden Day 2.0 dejó tests SKIPPED; la certificación no es válida."
            grep -E 'SKIPPED|skipped' /tmp/golden-day-v2-pg.log || true
            exit 1
          fi

      # V2.46/AUTO-6 (Crash/Recovery): el día REAL sobre PG con MUERTE SUCIA del proceso
      # (fill parcial durable → kill() → reinicio → reconciliación convergente → cierre
      # limpio). Paso DEDICADO con log y guard anti-skip: un skip silencioso sería una
      # certificación fantasma del escenario que el roadmap §8 exige.
      - name: Pytest Crash/Recovery Day (proceso scheduler matado en sucio + PG, fail if skipped)
        run: |
          set -o pipefail
          uv run pytest \
            apps/api-python/tests/test_crash_recovery_day_process_pg.py \
            -q --tb=short -rs | tee /tmp/auto-crash-recovery-pg.log

      - name: Fail on skipped Crash/Recovery Day (no skip silencioso)
        if: always()
        run: |
          if [ ! -s /tmp/auto-crash-recovery-pg.log ]; then
            echo "::error::Crash/Recovery Day no dejó log de la corrida; la certificación no es válida."
            exit 1
          fi
          if grep -qE '(^|[0-9]+ )skipped|SKIPPED' /tmp/auto-crash-recovery-pg.log; then
            echo "::error::Crash/Recovery Day dejó tests SKIPPED; la certificación no es válida."
            grep -E 'SKIPPED|skipped' /tmp/auto-crash-recovery-pg.log || true
            exit 1
          fi

      # V2.46/AUTO-6 (Concurrent AUTO): tres sesiones concurrentes sobre la MISMA cuenta
      # en PG real (1 señal ⇒ 1 intent de orden ⇒ 1 reserva durable, sin sobre-riesgo).
      # Gemelo estrecho del núcleo hermético; paso DEDICADO con su propio guard anti-skip.
      - name: Pytest Concurrent AUTO (3 sesiones concurrentes + PG, fail if skipped)
        run: |
          set -o pipefail
          uv run pytest \
            apps/api-python/tests/test_concurrent_auto_pg.py \
            -q --tb=short -rs | tee /tmp/auto-concurrent-pg.log

      - name: Fail on skipped Concurrent AUTO (no skip silencioso)
        if: always()
        run: |
          if [ ! -s /tmp/auto-concurrent-pg.log ]; then
            echo "::error::Concurrent AUTO no dejó log de la corrida; la certificación no es válida."
            exit 1
          fi
          if grep -qE '(^|[0-9]+ )skipped|SKIPPED' /tmp/auto-concurrent-pg.log; then
            echo "::error::Concurrent AUTO dejó tests SKIPPED; la certificación no es válida."
            grep -E 'SKIPPED|skipped' /tmp/auto-concurrent-pg.log || true
            exit 1
          fi

      # V2.46.x/AUTO-6 HARDENING (parada dura durable): engage con productor real →
      # crash → restart HALTED → release con ``reconciliation_id`` → RUNNING, sobre PG y
      # con sesiones/procesos distintos. Paso DEDICADO con guard anti-skip.
      - name: Pytest HardKill recovery (parada dura durable + PG, fail if skipped)
        run: |
          set -o pipefail
          uv run pytest \
            apps/api-python/tests/test_auto_v46_hardkill_recovery_pg.py \
            -q --tb=short -rs | tee /tmp/auto-hardkill-pg.log

      - name: Fail on skipped HardKill recovery (no skip silencioso)
        if: always()
        run: |
          if [ ! -s /tmp/auto-hardkill-pg.log ]; then
            echo "::error::HardKill recovery no dejó log de la corrida; la certificación no es válida."
            exit 1
          fi
          if grep -qE '(^|[0-9]+ )skipped|SKIPPED' /tmp/auto-hardkill-pg.log; then
            echo "::error::HardKill recovery dejó tests SKIPPED; la certificación no es válida."
            grep -E 'SKIPPED|skipped' /tmp/auto-hardkill-pg.log || true
            exit 1
          fi

      # V2.46.x/AUTO-6 HARDENING (inyección de crash): la muerte EN MEDIO de la
      # materialización (APPLYING con lease caído, fill parcial entre tranchas) sobre PG
      # y con sesiones distintas: exactly-once del efecto financiero. Paso DEDICADO.
      - name: Pytest crash injection matrix (exactly-once + PG, fail if skipped)
        run: |
          set -o pipefail
          uv run pytest \
            apps/api-python/tests/test_auto_v46_crash_injection_pg.py \
            -q --tb=short -rs | tee /tmp/auto-crash-inject-pg.log

      - name: Fail on skipped crash injection matrix (no skip silencioso)
        if: always()
        run: |
          if [ ! -s /tmp/auto-crash-inject-pg.log ]; then
            echo "::error::Crash injection matrix no dejó log de la corrida; la certificación no es válida."
            exit 1
          fi
          if grep -qE '(^|[0-9]+ )skipped|SKIPPED' /tmp/auto-crash-inject-pg.log; then
            echo "::error::Crash injection matrix dejó tests SKIPPED; la certificación no es válida."
            grep -E 'SKIPPED|skipped' /tmp/auto-crash-inject-pg.log || true
            exit 1
          fi

      # V2.46.x/AUTO-6 HARDENING (concurrencia multi-proceso): N ``scheduler_worker``
      # reales compitiendo por la misma señal; invariante medido en BD (1 orden, 1
      # reserva, 1 efecto financiero) y convergencia tras matar uno. Paso DEDICADO.
      - name: Pytest multiprocess AUTO (N procesos reales + PG, fail if skipped)
        run: |
          set -o pipefail
          uv run pytest \
            apps/api-python/tests/test_auto_v46_multiprocess_pg.py \
            -q --tb=short -rs | tee /tmp/auto-multiprocess-pg.log

      - name: Fail on skipped multiprocess AUTO (no skip silencioso)
        if: always()
        run: |
          if [ ! -s /tmp/auto-multiprocess-pg.log ]; then
            echo "::error::Multiprocess AUTO no dejó log de la corrida; la certificación no es válida."
            exit 1
          fi
          if grep -qE '(^|[0-9]+ )skipped|SKIPPED' /tmp/auto-multiprocess-pg.log; then
            echo "::error::Multiprocess AUTO dejó tests SKIPPED; la certificación no es válida."
            grep -E 'SKIPPED|skipped' /tmp/auto-multiprocess-pg.log || true
            exit 1
          fi

  dr-verify:
    # DR honesta en el CI del tag (hallazgo C2-12 P2 / C2-13): `pnpm db:dr:test`
    # (batería de Disaster Recovery: dump + checksum + restore a scratch + Alembic
    # heading + integridad financiera C2-02) debía correr en release-tag y NO
    # lo hacía; además dependía de `docker exec bolsa-postgres`, contenedor que el
    # CI no tiene.
    # Este job expone PostgreSQL como `services: postgres` (igual que
    # lifecycle-pg / playwright-integrated) alcanzable por red en 127.0.0.1:5432,
    # instala el cliente postgresql-client (psql/pg_dump) porque los runners
    # ubuntu-latest NO llevan `psql` preinstalado, hace `alembic upgrade head`
    # sobre bolsa_v1 y ejecuta la batería en modo TCP por red
    # (BOLSA_DR_TCP=1) contra el service. El usuario bolsa del contenedor de
    # servicio es role superuser del image oficial → puede DROP/CREATE la BD
    # scratch `bolsa_v1_dr_test` en el mismo server (no requiere superuser extra).
    name: dr-verify (battery DB_DR / TCP CI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bolsa
          POSTGRES_PASSWORD: bolsa_dev
          POSTGRES_DB: bolsa_v1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bolsa -d bolsa_v1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bolsa:bolsa_dev@localhost:5432/bolsa_v1
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: bolsa
      DB_PASSWORD: bolsa_dev
      DB_NAME: bolsa_v1
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: bolsa
      PGPASSWORD: bolsa_dev
      BOLSA_DR_TCP: '1'
      DR_TARGET_DB: bolsa_v1_dr_test
      ENVIRONMENT: testing
      # resolvePython() (lib/python.mjs) respeta PYTHON: db-restore lanza Alembic
      # contra la scratch con el python del venv de `uv sync` (deps instaladas).
      PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Los runners ubuntu-latest NO traen psql/pg_dump; los necesitamos en modo
      # TCP (clientes de host). Instalamos el cliente oficial PostgreSQL.
      - name: Install PostgreSQL client (psql/pg_dump)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install Python dependencies
        run: uv sync

      - name: Alembic upgrade head (main `bolsa_v1` → head)
        run: cd packages/py/infrastructure && uv run alembic upgrade head

      # Batería DR end-to-end (C2-12/C2-13 + C2-02), ahora por TCP contra el
      # service. La scratch `bolsa_v1_dr_test` se crea/hace drop en el mismo
      # service PostgreSQL (rol bolsa = superuser del contenedor oficial).
      # Un rojo aquí debe romper el tag: no usamos `--ignore`; si `node` sale != 0
      # el step falla y la cert (needs: dr-verify) pinta el release no-GREEN.
      - name: Disaster Recovery battery (db:dr:test · TCP)
        run: node scripts/db-dr-verify.mjs

  a7-gate:
    # V2.18 / A7 Iter-1 (escenario C3 🟡 parcial): crash-injection real-PG sobre el worker de
    # recovery/scheduler. BD dedicada `bolsa_v1_a7` (drop+create aislada del residuo
    # de otros jobs). El esquema lo lleva a head la propia batería (`ensure_migrated`,
    # idempotente, respetando DATABASE_URL) para no depender de la migración CLI de
    # `alembic.ini` (que apunta a la DB principal). `certify` depende de a7-gate → un
    # fallo aquí no-GREENea el tag.
    name: a7-gate (A7 C3 chaos live_a7 · dedicated real-PG)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bolsa
          POSTGRES_PASSWORD: bolsa_dev
          POSTGRES_DB: bolsa_v1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bolsa -d bolsa_v1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bolsa:bolsa_dev@localhost:5432/bolsa_v1
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: bolsa
      DB_PASSWORD: bolsa_dev
      DB_NAME: bolsa_v1
      LIVE_A7_PG_REQUIRED: '1'   # ahora en todos los steps del job: si no hay DB
                                 # disponible, falla (no skip mudo de A7).
      JWT_SIGNING_KEY: ci-a7-gate-secret-key
      APP_AUTH_SECRET: ci-a7-gate-secret-key
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Alembic upgrade head (main prepared service `bolsa_v1`)
        # Migra la DB principal del service (default de alembic.ini); la scratch la
        # migra la propia batería con `ensure_migrated`. Mantiene bolsa_v1 operativa
        # por si cualquier instrumento del service la necesita.
        run: cd packages/py/infrastructure && uv run alembic upgrade head

      - name: Prepare dedicated scratch DB (bolsa_v1_a7) drop+create
        # DB dedicada aislada del residuo; el esquema lo lleva a la head (hoy 025) la
        # propia batería (fixture `factory` → `ensure_migrated` idempotente). El rol
        # `bolsa` del container postgres:16-alpine es superuser → puede DROP/CREATE.
        env:
          DATABASE_URL: postgresql://bolsa:bolsa_dev@localhost:5432/bolsa_v1_a7
          DB_NAME: bolsa_v1_a7
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: bolsa
          PGPASSWORD: bolsa_dev
        run: |
          psql -d bolsa_v1 -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS bolsa_v1_a7 WITH (FORCE);" \
            -c "CREATE DATABASE bolsa_v1_a7 OWNER bolsa;"

      - name: Pytest A7 chaos live_a7 (dedicated real-PG, fail if skipped)
        # C3 on real Postgres; `LIVE_A7_PG_REQUIRED=1` hace fail duro si un
        # escenario se salta (un grupo que debe ejercitar C3 no puede pasar en verde
        # sólo porque "no hay DB"). Corre contra la scaffold `bolsa_v1_a7`.
        env:
          DATABASE_URL: postgresql://bolsa:bolsa_dev@localhost:5432/bolsa_v1_a7
          DB_NAME: bolsa_v1_a7
          LIVE_A7_PG_REQUIRED: '1'
        run: >
          uv run pytest
          apps/api-python/tests/chaos/live_a7
          -q
          --tb=short

  certify:
    name: certify (aggregate + artifact)
    runs-on: ubuntu-latest
    needs: [security, shared, spine, frontend, python, playwright-mock, lifecycle-pg, dr-verify, a7-gate]
    if: always()
    steps:
      - name: Fail if any required job failed
        if: >
          needs.security.result != 'success' ||
          needs.shared.result != 'success' ||
          needs.spine.result != 'success' ||
          needs.frontend.result != 'success' ||
          needs.python.result != 'success' ||
          needs.playwright-mock.result != 'success' ||
          needs.lifecycle-pg.result != 'success' ||
          needs.dr-verify.result != 'success' ||
          needs.a7-gate.result != 'success'
        run: |
          echo "Release tag CI not GREEN"
          echo "security=${{ needs.security.result }}"
          echo "shared=${{ needs.shared.result }}"
          echo "spine=${{ needs.spine.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "python=${{ needs.python.result }}"
          echo "playwright-mock=${{ needs.playwright-mock.result }}"
          echo "lifecycle-pg=${{ needs.lifecycle-pg.result }}"
          echo "dr-verify=${{ needs.dr-verify.result }}"
          echo "a7-gate=${{ needs.a7-gate.result }}"
          exit 1

      - name: Write summary artifact
        env:
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('dispatch-{0}', github.sha) }}
          JOB_SECURITY: ${{ needs.security.result }}
          JOB_SHARED: ${{ needs.shared.result }}
          JOB_SPINE: ${{ needs.spine.result }}
          JOB_FRONTEND: ${{ needs.frontend.result }}
          JOB_PYTHON: ${{ needs.python.result }}
          JOB_PLAYWRIGHT_MOCK: ${{ needs.playwright-mock.result }}
          JOB_LIFECYCLE_PG: ${{ needs.lifecycle-pg.result }}
          JOB_DR_VERIFY: ${{ needs.dr-verify.result }}
          JOB_A7_GATE: ${{ needs.a7-gate.result }}
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          summary = {
              "workflow": "release-tag-ci",
              "tag": os.environ["TAG_NAME"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "asOf": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "status": "GREEN",
              "jobs": {
                  "security": os.environ["JOB_SECURITY"],
                  "shared": os.environ["JOB_SHARED"],
                  "spine": os.environ["JOB_SPINE"],
                  "frontend": os.environ["JOB_FRONTEND"],
                  "python": os.environ["JOB_PYTHON"],
                  "playwright-mock": os.environ["JOB_PLAYWRIGHT_MOCK"],
                  "lifecycle-pg": os.environ["JOB_LIFECYCLE_PG"],
                  "dr-verify": os.environ["JOB_DR_VERIFY"],
                  "a7-gate": os.environ["JOB_A7_GATE"],
              },
          }
          path = "artifacts/release-tag-ci-summary.json"
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(summary, fh, indent=2)
              fh.write("\n")
          print(open(path, encoding="utf-8").read())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: release-tag-ci-summary
          path: artifacts/release-tag-ci-summary.json
          if-no-files-found: error
