# INFRA — CI reproducible por tag (ADR triage v1.8.1 / roadmap v1.9).
# Dispara en push de tags v* SIN path-filter (docs-only stamp también certifica).
# Path-filters de frontend-ci / python-ci diarios quedan intactos.
name: Release tag CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_e2e_integration:
        description: Run integrated Playwright E2E (PostgreSQL + API)
        type: boolean
        default: false

concurrency:
  group: release-tag-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shared:
    name: shared (build/typecheck/test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @bolsa/shared build

      - name: Typecheck shared
        run: pnpm --filter @bolsa/shared typecheck

      - name: Test shared
        run: pnpm --filter @bolsa/shared test

  spine:
    name: decision-spine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync

      - name: Expose uv venv on PATH
        run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Decision Spine battery
        run: pnpm test:decision-spine

  frontend:
    name: frontend (typecheck/lint/test/build + contract:check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @bolsa/shared build

      - name: Typecheck web
        run: pnpm --filter @bolsa/web typecheck

      - name: Lint web
        run: pnpm --filter @bolsa/web lint

      - name: Test web
        run: pnpm --filter @bolsa/web test

      - name: Contract check (no gen)
        run: pnpm --filter @bolsa/web contract:check

      - name: Build web
        run: pnpm --filter @bolsa/web build

  playwright-mock:
    name: playwright (mock E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @bolsa/shared build

      - name: Install Playwright Chromium
        run: pnpm --filter @bolsa/web exec playwright install --with-deps chromium

      # V1.86 tip honesty: gp-e2e + certification mocks V1.73–V1.86 (no PG · no LIVE)
      - name: Run mock browser E2E (gp-e2e + gp-v173..gp-v186)
        working-directory: apps/web
        env:
          E2E_RUN: '1'
        run: pnpm e2e -- "gp-e2e|gp-v173|gp-v174|gp-v175|gp-v176|gp-v177|gp-v178|gp-v179|gp-v181|gp-v183|gp-v184|gp-v185|gp-v186"

  playwright-integrated:
    name: playwright (integrated E2E, opt-in)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e_integration == true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bolsa
          POSTGRES_PASSWORD: bolsa_dev
          POSTGRES_DB: bolsa_v1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bolsa -d bolsa_v1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bolsa:bolsa_dev@localhost:5432/bolsa_v1
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: bolsa
      DB_PASSWORD: bolsa_dev
      DB_NAME: bolsa_v1
      ENVIRONMENT: testing
      JWT_SIGNING_KEY: ci-e2e-integration-test-secret-key
      APP_AUTH_SECRET: ci-e2e-integration-test-secret-key
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync

      - name: Expose uv venv on PATH
        run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Build shared
        run: pnpm --filter @bolsa/shared build

      - name: Write CI env file
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://bolsa:bolsa_dev@localhost:5432/bolsa_v1
          DB_PASSWORD=bolsa_dev
          JWT_SIGNING_KEY=ci-e2e-integration-test-secret-key
          APP_AUTH_SECRET=ci-e2e-integration-test-secret-key
          ENVIRONMENT=testing
          CORS_ORIGIN=http://localhost:5173
          EOF

      - name: Alembic upgrade
        run: cd packages/py/infrastructure && uv run alembic upgrade head

      - name: Prisma generate + seed instruments
        run: |
          pnpm --filter @bolsa/database db:generate
          pnpm db:seed

      - name: Start API
        run: |
          uvicorn bolsa_api.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          exit 1

      - name: Install Playwright Chromium
        run: pnpm --filter @bolsa/web exec playwright install --with-deps chromium

      - name: Run integrated browser E2E
        working-directory: apps/web
        env:
          E2E_RUN: '1'
          E2E_INTEGRATION: '1'
          E2E_ALLOW_DEV_DB: '1'
        run: pnpm e2e -- gp-v164-ui gp-v167 gp-v168 gp-v170-list

  python:
    name: python (ruff/imports/mypy/pytest offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check packages/py apps/api-python --config pyproject.toml

      - name: Import-linter
        run: uv run lint-imports --config packages/py/.importlinter

      - name: Mypy
        run: >
          uv run mypy
          packages/py/domain/src
          packages/py/market/src
          packages/py/infrastructure/src
          packages/py/application/src
          apps/api-python/src
          --follow-imports=silent

      - name: Pytest offline
        run: >
          uv run pytest
          packages/py/domain/tests
          packages/py/market/tests
          packages/py/analytics/tests
          packages/py/application/tests/test_lifecycle_event_store.py
          packages/py/infrastructure/tests/test_verify_financial_invariants.py
          apps/api-python/tests
          --ignore=apps/api-python/tests/integration
          --ignore=apps/api-python/tests/test_lists.py
          --ignore=apps/api-python/tests/test_workspaces.py
          --ignore=apps/api-python/tests/test_health.py
          --ignore=apps/api-python/tests/test_auth.py
          --ignore=apps/api-python/tests/test_account_isolation.py
          --ignore=apps/api-python/tests/test_ai_authoring.py
          --ignore=apps/api-python/tests/test_f7b_legacy_user_id_backfill.py
          --ignore=apps/api-python/tests/test_platform_events_isolation.py
          --ignore=apps/api-python/tests/test_trackers_policies_isolation.py
          --ignore=apps/api-python/tests/test_workspaces_isolation.py
          --ignore=apps/api-python/tests/test_lifecycle_auth.py
          --ignore=apps/api-python/tests/test_lifecycle_golden_v188.py
          -q

  lifecycle-pg:
    name: lifecycle-pg (Alembic + auth + golden restart)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bolsa
          POSTGRES_PASSWORD: bolsa_dev
          POSTGRES_DB: bolsa_v1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bolsa -d bolsa_v1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bolsa:bolsa_dev@localhost:5432/bolsa_v1
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: bolsa
      DB_PASSWORD: bolsa_dev
      DB_NAME: bolsa_v1
      LIFECYCLE_PG_REQUIRED: '1'
      JWT_SIGNING_KEY: ci-lifecycle-pg-secret-key
      APP_AUTH_SECRET: ci-lifecycle-pg-secret-key
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Alembic upgrade head
        run: cd packages/py/infrastructure && uv run alembic upgrade head

      - name: Pytest lifecycle PG + auth + golden V1.88 (fail if skipped)
        run: >
          uv run pytest
          packages/py/infrastructure/tests/test_lifecycle_event_store_pg.py
          apps/api-python/tests/test_lifecycle_auth.py
          apps/api-python/tests/test_lifecycle_golden_v188.py
          -q
          --tb=short

  certify:
    name: certify (aggregate + artifact)
    runs-on: ubuntu-latest
    needs: [security, shared, spine, frontend, python, playwright-mock, lifecycle-pg]
    if: always()
    steps:
      - name: Fail if any required job failed
        if: >
          needs.security.result != 'success' ||
          needs.shared.result != 'success' ||
          needs.spine.result != 'success' ||
          needs.frontend.result != 'success' ||
          needs.python.result != 'success' ||
          needs.playwright-mock.result != 'success' ||
          needs.lifecycle-pg.result != 'success'
        run: |
          echo "Release tag CI not GREEN"
          echo "security=${{ needs.security.result }}"
          echo "shared=${{ needs.shared.result }}"
          echo "spine=${{ needs.spine.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "python=${{ needs.python.result }}"
          echo "playwright-mock=${{ needs.playwright-mock.result }}"
          echo "lifecycle-pg=${{ needs.lifecycle-pg.result }}"
          exit 1

      - name: Write summary artifact
        env:
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('dispatch-{0}', github.sha) }}
          JOB_SECURITY: ${{ needs.security.result }}
          JOB_SHARED: ${{ needs.shared.result }}
          JOB_SPINE: ${{ needs.spine.result }}
          JOB_FRONTEND: ${{ needs.frontend.result }}
          JOB_PYTHON: ${{ needs.python.result }}
          JOB_PLAYWRIGHT_MOCK: ${{ needs.playwright-mock.result }}
          JOB_LIFECYCLE_PG: ${{ needs.lifecycle-pg.result }}
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          summary = {
              "workflow": "release-tag-ci",
              "tag": os.environ["TAG_NAME"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "asOf": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "status": "GREEN",
              "jobs": {
                  "security": os.environ["JOB_SECURITY"],
                  "shared": os.environ["JOB_SHARED"],
                  "spine": os.environ["JOB_SPINE"],
                  "frontend": os.environ["JOB_FRONTEND"],
                  "python": os.environ["JOB_PYTHON"],
                  "playwright-mock": os.environ["JOB_PLAYWRIGHT_MOCK"],
                  "lifecycle-pg": os.environ["JOB_LIFECYCLE_PG"],
              },
          }
          path = "artifacts/release-tag-ci-summary.json"
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(summary, fh, indent=2)
              fh.write("\n")
          print(open(path, encoding="utf-8").read())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: release-tag-ci-summary
          path: artifacts/release-tag-ci-summary.json
          if-no-files-found: error
