# INFRA — CI reproducible por tag (ADR triage v1.8.1 / roadmap v1.9).
# Dispara en push de tags v* SIN path-filter (docs-only stamp también certifica).
# Path-filters de frontend-ci / python-ci diarios quedan intactos.
name: Release tag CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_e2e_integration:
        description: Run integrated Playwright E2E (PostgreSQL + API)
        type: boolean
        default: false

concurrency:
  group: release-tag-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shared:
    name: shared (build/typecheck/test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @bolsa/shared build

      - name: Typecheck shared
        run: pnpm --filter @bolsa/shared typecheck

      - name: Test shared
        run: pnpm --filter @bolsa/shared test

  spine:
    name: decision-spine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync

      - name: Expose uv venv on PATH
        run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Decision Spine battery
        run: pnpm test:decision-spine

  frontend:
    name: frontend (typecheck/lint/test/build + contract:check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @bolsa/shared build

      - name: Typecheck web
        run: pnpm --filter @bolsa/web typecheck

      - name: Lint web
        run: pnpm --filter @bolsa/web lint

      - name: Test web
        run: pnpm --filter @bolsa/web test

      - name: Contract check (no gen)
        run: pnpm --filter @bolsa/web contract:check

      - name: Build web
        run: pnpm --filter @bolsa/web build

  playwright-mock:
    name: playwright (mock E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @bolsa/shared build

      - name: Install Playwright Chromium
        run: pnpm --filter @bolsa/web exec playwright install --with-deps chromium

      # V1.86 tip honesty: gp-e2e + certification mocks V1.73–V1.86 (no PG · no LIVE)
      # V2.45: filtro `gp-e2e` ya incluye gp-e2e-v25/v26/v28 (cabin cert) — sin glob extra.
      - name: Run mock browser E2E (gp-e2e + gp-v173..gp-v186)
        working-directory: apps/web
        env:
          E2E_RUN: '1'
        run: pnpm e2e -- "gp-e2e|gp-v173|gp-v174|gp-v175|gp-v176|gp-v177|gp-v178|gp-v179|gp-v181|gp-v183|gp-v184|gp-v185|gp-v186"

  playwright-integrated:
    name: playwright (integrated E2E, opt-in)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e_integration == true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bolsa
          POSTGRES_PASSWORD: bolsa_dev
          POSTGRES_DB: bolsa_v1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bolsa -d bolsa_v1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bolsa:bolsa_dev@localhost:5432/bolsa_v1
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: bolsa
      DB_PASSWORD: bolsa_dev
      DB_NAME: bolsa_v1
      ENVIRONMENT: testing
      JWT_SIGNING_KEY: ci-e2e-integration-test-secret-key
      APP_AUTH_SECRET: ci-e2e-integration-test-secret-key
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync

      - name: Expose uv venv on PATH
        run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Build shared
        run: pnpm --filter @bolsa/shared build

      - name: Write CI env file
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://bolsa:bolsa_dev@localhost:5432/bolsa_v1
          DB_PASSWORD=bolsa_dev
          JWT_SIGNING_KEY=ci-e2e-integration-test-secret-key
          APP_AUTH_SECRET=ci-e2e-integration-test-secret-key
          ENVIRONMENT=testing
          CORS_ORIGIN=http://localhost:5173
          EOF

      - name: Alembic upgrade
        run: cd packages/py/infrastructure && uv run alembic upgrade head

      - name: Prisma generate + seed instruments
        run: |
          pnpm --filter @bolsa/database db:generate
          pnpm db:seed

      - name: Start API
        run: |
          uvicorn bolsa_api.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          exit 1

      - name: Install Playwright Chromium
        run: pnpm --filter @bolsa/web exec playwright install --with-deps chromium

      - name: Run integrated browser E2E
        working-directory: apps/web
        env:
          E2E_RUN: '1'
          E2E_INTEGRATION: '1'
          E2E_ALLOW_DEV_DB: '1'
        run: pnpm e2e -- gp-v164-ui gp-v167 gp-v168 gp-v170-list

  python:
    name: python (ruff/imports/mypy/pytest offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check packages/py apps/api-python --config pyproject.toml

      - name: Import-linter
        run: uv run lint-imports --config packages/py/.importlinter

      - name: Mypy
        run: >
          uv run mypy
          packages/py/domain/src
          packages/py/market/src
          packages/py/infrastructure/src
          packages/py/application/src
          apps/api-python/src
          --follow-imports=silent

      - name: Pytest offline
        # Sin servicio Postgres en este job: unitarios + API tests offline. La
        # integración ASGI/DB y todo lo PG-gated va en los jobs con servicio (abajo).
        #
        # V2.40.2: estos comentarios van FUERA del bloque plegado. En un ``run: >`` cada
        # línea es texto del comando, así que un ``#`` intercalado convertía el resto de
        # la lista en comentario de shell: el step ejecutaba solo los tests anteriores al
        # primer bloque marcado y el job quedaba verde con la mayor parte de la batería
        # sin correr (mismo hazard que en python-ci.yml, ver audit-pack v2.40.2).
        #
        # Procedencia de cada bloque de la lista (mismo orden que el comando):
        # V2.25/A10: fases del Strategy Lifecycle + orquestador V2.26 (herméticos).
        # V2.27/A10: universo ESTUDIO real + runner LAB real (herméticos).
        # V2.28/A10: vigilancia real desde fills SIM atribuidos a la versión.
        # V2.29/A10: COACH comparativo + SignalEvaluator real (herméticos).
        # V2.31/A11: Discovery Engine (catálogo + motor + dispatch declarativo del LAB).
        # V2.36/V2.37: evidencia adaptativa (prior determinista) + search policy.
        # V2.38: granularidad por región de parámetros (bucket determinista puro).
        # V2.39: régimen de mercado por trial (clasificador determinista puro, as-of).
        # V2.40/AUTO 2.0: Investment Operating System — pipeline de decisión
        # (snapshot/ranker/decider/allocator/position manager) + identidad de señal.
        # Herméticos: sin PG, sin red, sin LIVE. La durabilidad V2 con PG real va en el
        # job lifecycle-pg (gate fail-if-skipped).
        # V2.32/A12: evidencia shadow ejecutada (dominio + replay determinista).
        # V2.30: tests PG que ahora corre el job lifecycle-pg (necesitan PG; sin --ignore
        # se recolectarían aquí sin BD y skipearían en silencio).
        # V2.32/A12: el E2E A11 necesita PG real (lo corre lifecycle-pg).
        # V2.40/AUTO 2.0: la durabilidad real del estado V2 (plan de posición + señales
        # consumidas, migración 040) necesita PG real → job lifecycle-pg con gate
        # fail-if-skipped. Sin --ignore se recolectaría aquí y skipearía en mudo.
        # V2.40.1/AUTO 2.0 y V2.40.2: contexto de cartera (sector + ADV + frescura) y
        # claves naturales únicas → mismo criterio, los certifica el job con PG.
        # V2.40.3: la clave de idempotencia financiera (recorte sin pérdida) es hermética
        # y entra aquí; el día AUTO real que la destapó va en el job lifecycle-pg.
        # V2.40.4/AUTO 2.0 Safety & Accounting: TOP_N como tope de evaluación, measurement
        # status de riesgo/exposición, libro de órdenes pendientes y validación de
        # TradePlan (herméticos, stores in-memory) entran aquí con nombre propio; el caso
        # crash-left-CAPTURED con PG real va en el job auto-v2-durable-pg.
        # V2.40.5/AUTO-1A: ledger de posición y lectura de fills APPLIED (puros/herméticos)
        # con nombre propio; el reinicio con PG real y el bucle de la jornada completa del
        # scheduler se certifican en lifecycle-pg / auto-v2-durable-pg.
        # AUTO-1: el libro de reservas (hermético) entra igual de explícito; su
        # persistencia durable y la reconciliación van en el job auto-v2-durable-pg.
        # AUTO-1b: ese fichero PG queda en ``--ignore`` de este job offline y corre con
        # gate propio en lifecycle-pg (migración 042 + reinicio por otra sesión).
        # V2.42 slice 2b (E1/E2/E3): el golden path de la MESA (entrada → protección → T1
        # → salida → reconciliación) y sus gemelos fail entran explícitos. Certifican que
        # la invalidación confirmada VENDE (D2) y que el techo de mantenimiento no se
        # re-deriva, en el camino completo, no sólo en el módulo de decisión.
        # V2.42 slice 2c (cierre de AUTO-2): esta lista es POR FICHERO, así que el día
        # golden del worker (``test_auto_v2_golden_day_evidence.py``) va explícito, igual
        # que la agregación pura del día (``test_auto_daily_journal.py``: existía desde
        # v2.24 pero NO estaba en la lista, así que sus gates nuevos no corrían aquí).
        # V2.43/AUTO-3: la tabla pura del gobernador la recoge el pase de directorio de
        # ``packages/py/analytics/tests`` y la evidencia la de ``apps/api-python/tests``;
        # el GATE de aplicación (flag OFF byte-idéntico, vetos ``governor_*``, escalado de
        # tamaño/edge y las tres dimensiones en el journal) va explícito por ser POR FICHERO.
        # V2.44/AUTO-4: el valor esperado y el optimizador puros entran por el pase de
        # directorio de ``packages/py/analytics/tests``; el GATE del cableado (flag OFF
        # byte-idéntico y el TOP que la combinación no elige con su motivo REAL) va
        # explícito por el mismo motivo.
        # V2.45/AUTO-5 (Golden Day 2.0): el embudo hermético (``test_auto_daily_journal``)
        # y la identidad de estrategia en el payload entran explícitos/pase de directorio.
        # El día REAL (proceso scheduler + PG) se certifica en el job lifecycle-pg del tag
        # con su gate fail-if-skipped, así que va en ``--ignore`` de este job offline.
        # V2.46/AUTO-6 (Crash/Recovery + Concurrent AUTO): las dos capas herméticas
        # (``test_auto_v46_crash_recovery.py`` y ``test_auto_v46_concurrent.py``) entran por
        # el pase de directorio de ``apps/api-python/tests``. Sus gemelos PG
        # (``test_crash_recovery_day_process_pg.py`` y ``test_concurrent_auto_pg.py``) van en
        # ``--ignore`` aquí (sin PG skipearían en mudo) y corren en pasos dedicados del job
        # ``lifecycle-pg`` del tag con gate propio.
        # V2.46.x/AUTO-6 HARDENING: la recuperación de la parada dura
        # (``test_auto_v46_hardkill_recovery_pg.py``), la inyección de crash por transición
        # (``test_auto_v46_crash_injection_pg.py``) y la concurrencia MULTI-PROCESO
        # (``test_auto_v46_multiprocess_pg.py``) son capas PG y van por el mismo camino
        # (``--ignore`` aquí; pasos dedicados en ``lifecycle-pg`` con gate fail-if-skipped).
        # V2.47 (trazabilidad de ciclo + identidad de señales + AUTO-7 + valor esperado en
        # el journal): sus gates de APLICACIÓN van EXPLÍCITOS porque esta lista es POR
        # FICHERO (``packages/py/analytics/tests`` llega por pase de directorio, y ahí solo
        # entra el informe PURO ``test_auto_self_evaluation.py``). Sin registrarlos, los
        # cuatro ficheros no correrían en este job: ``test_auto_v47_cycle_trace.py``,
        # ``test_auto_v47_expected_value_journal.py``, ``test_auto_v47_signal_identity.py``
        # y ``test_auto_self_evaluation_feed.py``. Los herméticos de ``V2.46.x``
        # (``test_auto_v46_hardkill_recovery.py``, ``test_auto_v46_crash_injection_matrix.py``)
        # entran por el pase de directorio de ``apps/api-python/tests``.
        # V2.47: ``test_decision_journal_studies.py`` (existe desde v2.44) no estaba en la
        # lista de NINGÚN job, así que sus 10 tests no corrían en CI; se registra aquí y en
        # el job ``quality`` de ``python-ci.yml`` (misma deuda que v2.42.2 cerró para
        # ``test_auto_daily_journal.py``).
        # V2.48/AUTO-8 (Adaptive AUTO): el puro ``test_auto_adaptive.py`` entra por el pase
        # de directorio de ``packages/py/analytics/tests``; el gate de APLICACIÓN
        # ``test_auto_adaptive_entry.py`` (flag OFF byte-idéntico, Adaptive no salta los
        # gates duros, rotación con régimen sintético) va EXPLÍCITO porque sin registro no
        # correría en este job.
        # V2.50/AUTO-9 (R medido por ciclo): ``test_cycle_risk.py`` (productor READ-ONLY de
        # denominador de R y su costura con el informe AUTO-7) va EXPLÍCITO por la misma
        # razón: ``packages/py/application/tests`` no tiene pase de directorio aquí. Su
        # costura en el worker (``test_auto_v50_auto9_cycle_risk_seam.py``) entra por el
        # pase de directorio de ``apps/api-python/tests``.
        # V2.51/AUTO-10 (journal durable por ciclo): el constructor PURO
        # ``test_auto_cycle_journal.py`` (derivación determinista de ``decision_id``, hueco
        # declarado, payload estable) va EXPLÍCITO por la misma razón: sin registro no
        # correría en ninguna parte. Su costura en el worker
        # (``test_auto_v51_auto10_cycle_journal_seam.py``) entra por el pase de directorio
        # de ``apps/api-python/tests``, que este job ya recolecta entero.
        # V2.51/AUTO-10 (lector del journal, paso 3): ``test_auto_cycle_regime_reader.py``
        # (derivación del ``decision_id``, confirmación por payload, los tres huecos
        # separados, tandas acotadas) va EXPLÍCITO por la misma razón. La costura de consumo
        # en el worker entra por el pase de directorio, y la durabilidad real (escritor +
        # lector desde OTRA sesión sobre la tabla del spine) se certifica con PG en el
        # bloque ``auto-v2-durable-pg``.
        # V2.52/AUTO-11 (estado Adaptive durable): los TRES módulos puros nuevos
        # (``test_auto_adaptive_journal.py``, ``test_auto_adaptive_recovery.py`` y
        # ``test_auto_cycle_reconciliation.py``) van EXPLÍCITOS porque
        # ``packages/py/application/tests`` no tiene pase de directorio en este job: sin
        # registro no correrían en ninguna parte. Su costura en el worker
        # (``test_auto_v52_auto11_adaptive_state_seam.py``) entra por el pase de directorio
        # de ``apps/api-python/tests``, que este job ya recolecta entero.
        # V2.56/AUTO-15 (racha durable del Data Gate): el puro del store
        # (``packages/py/application/tests/test_adaptive_gate_store.py``) va EXPLÍCITO por el
        # mismo motivo (ese directorio no tiene pase aquí). La declaración del gate entra por
        # el pase de ``packages/py/analytics/tests``, la costura del reinicio por el de
        # ``apps/api-python/tests``, y la certificación PG (migración 045 + otra sesión
        # leyendo la racha) va en el paso PG de más abajo con gate fail-if-skipped.
        # V2.57/AUTO-16 (referencia del fill): los puros del espejo durable y del coste aplicado
        # (``packages/py/application/tests/test_sim_fill_reference.py`` y
        # ``.../test_applied_cost.py``) van EXPLÍCITOS por el mismo motivo. La certificación PG
        # (migración 046 + la referencia sobresaliendo a una sesión nueva) va en el paso PG de
        # más abajo con gate fail-if-skipped.
        # V2.60/AUTO-19A (incertidumbre del edge + replay OOS): la costura del worker
        # (``apps/api-python/tests/test_auto_v60_auto19_uncertainty_seam.py``) va EXPLÍCITA —como
        # pide el plan de la fase— para certificar con nombre propio el frame ``uncertainty`` y las
        # dos claves nuevas de la evidencia; los puros entran por el pase de
        # ``packages/py/analytics/tests``. pytest deduplica la doble mención (no corre dos veces).
        # V2.61/AUTO-19B (calibración del intervalo + walk-forward): el puro
        # ``packages/py/analytics/tests/test_auto_adaptive_calibration.py`` entra por el pase de
        # ``packages/py/analytics/tests``. No hay costura nueva (el instrumento es puro y
        # read-only: no se cablea al worker, al plan ni al journal).
        # V2.62/AUTO-20 (material PAPER real + cierre de O1/O2): el puro de la calibración (O1/O2)
        # entra por ``packages/py/analytics/tests`` y el de la costura pública del material por el
        # pase de ``packages/py/application/tests``. El exportador ``paper_cycles_export.py`` es I/O
        # y NO se ejercita end-to-end aquí (declarado en el plan de la fase, §9).
        # V2.63/AUTO-20B (completitud del volcado + manifest/huella): el E2E REAL del exportador
        # (``apps/api-python/tests/test_auto_v63_auto20b_export_e2e_pg.py``) va en ``--ignore`` aquí
        # y se certifica en el paso PG de abajo con ``AUTO20B_EXPORT_PG_REQUIRED=1``. Sus casos PUROS
        # (paginación fail-closed + passthrough del manifest en el battery) viven en
        # ``.../test_auto_v63_auto20b_export_completeness.py`` y entran por el pase de directorio; la
        # huella de material (``packages/py/analytics/tests/test_auto_material_manifest.py``) entra por
        # el pase de analytics; y el manifest de aplicación
        # (``packages/py/application/tests/test_auto_v63_auto20b_material_manifest.py``) va EXPLÍCITO
        # en la lista, porque ese directorio NO tiene pase de directorio en este job.
        # V2.64/AUTO-20C (perimetro declarado + artefacto reproducible + PAPER VIRTUAL): el
        # render/artefacto (``packages/py/analytics/tests/test_auto_evidence_report.py``) y
        # ``--out``/``--render`` + bloqueo de venue no-PAPER
        # (``apps/api-python/tests/test_auto_v64_auto20c_artifact.py``) entran por los pases de
        # directorio; el perimetro muerde tambien en ``test_auto_v63_auto20b_material_manifest.py``
        # (ya en la lista) y en el E2E PG de abajo. El invariante «PAPER = dinero VIRTUAL, nunca
        # XTB» no anade camino LIVE: solo lo DECLARA.
        # V2.73/V2.74/AUTO-MATERIAL-1/2 (material PAPER READY): el puro del gate de dos niveles
        # (``packages/py/application/tests/test_paper_material_readiness.py``) va EXPLÍCITO porque
        # ese directorio NO tiene pase de directorio en este job; la costura del productor
        # (``apps/api-python/tests/test_auto_v74_producer_seam.py``) entra por el pase de
        # ``apps/api-python/tests`` de más abajo.
        # V2.76/AUTO-MATERIAL-4 (material de MERCADO forward): los dos puros nuevos van EXPLÍCITO por
        # el mismo motivo (este directorio NO tiene pase de directorio en este job): el respaldo de
        # precio con fail-closed (``.../test_market_price_snapshot.py``, proveedores fake, sin red) y
        # el par real de versiones sobre UNA cuenta (``.../test_auto_forward_deciders.py``: reparto
        # del watch + estampado de version + enrutado por simbolo). HUECO DECLARADO: al sellar
        # ``v2.76-beta`` esos dos ficheros solo estaban registrados en ``python-ci.yml``, así que el
        # job ``python`` del tag corrió ``2898 passed / 37 skipped`` (SIN estos 25 tests) mientras el
        # job ``quality`` de ``main`` del MISMO commit sí los ejecutó (``2912 passed / 40 skipped``).
        # Estas dos líneas son la corrección (no se movió el tag: ver PROJECT_STATE/audit-pack).
        run: >
          uv run pytest
          packages/py/domain/tests
          packages/py/market/tests
          packages/py/analytics/tests
          packages/py/application/tests/test_lifecycle_event_store.py
          packages/py/application/tests/test_reconcile_lifecycle_integrity_v193.py
          packages/py/application/tests/test_reconcile_financial_integrity_v194.py
          packages/py/application/tests/test_reconciliation_opening_gate.py
          packages/py/application/tests/test_strategy_lab_phase.py
          packages/py/application/tests/test_strategy_top3_coach_phase.py
          packages/py/application/tests/test_strategy_promotion_phase.py
          packages/py/application/tests/test_strategy_vigilance_phase.py
          packages/py/application/tests/test_auto_orchestrator.py
