[tool.uv.workspace]
members = [
  "packages/py/domain",
  "packages/py/market",
  "packages/py/infrastructure",
  "packages/py/application",
  "packages/py/analytics",
  "packages/py/ai",
  "apps/api-python",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "mypy>=1.14",
  "ruff>=0.9",
  "import-linter>=2.1",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["pandas.*", "pandas_ta.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
  "ollama: tests that require a running Ollama service",
  "integration: tests that require external services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

# Alineado con apps/api-python (CI: uv run ruff check … --config pyproject.toml).
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: deuda histórica de wrap; line-length sigue para formatters.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
  "bolsa_ai",
  "bolsa_analytics",
  "bolsa_api",
  "bolsa_application",
  "bolsa_domain",
  "bolsa_infrastructure",
  "bolsa_market",
]
